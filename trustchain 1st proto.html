<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0E1D3A">
<title>TrustChain — Digital Evidence Verification</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22><stop offset=%220%22 stop-color=%22%232A57D6%22/><stop offset=%221%22 stop-color=%22%231AA396%22/></linearGradient></defs><path d=%22M24 3.2 L41 9.6 V21.8 C41 32.9 34.2 41.4 24 44.8 C13.8 41.4 7 32.9 7 21.8 V9.6 Z%22 fill=%22url(%23g)%22/><path d=%22M16.2 24.6 L21.4 29.8 L32.2 18%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%224.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --navy-950:#081226;
  --navy-900:#0E1D3A;
  --navy-800:#16294D;
  --navy-700:#20345C;
  --blue-600:#2A57D6;
  --blue-500:#3E6EF0;
  --blue-100:#E4ECFF;
  --teal-500:#1FB6A8;
  --paper:#F2F5FA;
  --white:#FFFFFF;
  --ink:#101828;
  --ink-soft:#48526A;
  --ink-faint:#8891A6;
  --line:#E0E5EF;
  --line-strong:#C7CEDD;
  --red:#C23934;
  --red-bg:#FBE9E8;
  --amber:#AD7014;
  --amber-bg:#FCF1DA;
  --green:#1C8B5E;
  --green-bg:#E2F4EB;
  --grey:#5B6478;
  --grey-bg:#EAEDF3;
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(14,29,58,0.06);
  --shadow-md:0 6px 20px rgba(14,29,58,0.09);
  --sans:'Manrope', ui-sans-serif, system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
*{box-sizing:border-box;}
html{
  -webkit-text-size-adjust:100%; scroll-behavior:smooth;
  /* Tells the browser this page has a deliberate, self-contained light
     design and should NOT be auto-recolored by "Force dark" / "Simplified
     view"-style content-darkening features (common on Android Chrome and
     some browser extensions). Without this, those features can invert or
     rewrite text colors on elements that don't declare an explicit color
     (leaving only the icon visible, exactly the bug reported against the
     Verify tiles and the Emergency-mode tiles), while leaving our
     hard-coded light backgrounds untouched — producing invisible or
     wrong-colored text that isn't present in the actual DOM/CSS. */
  color-scheme: light;
}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;} }
h1,h2,h3,h4{font-family:var(--sans); margin:0;}
p{margin:0 0 12px; color:var(--ink-soft); max-width:64ch;}
a{color:var(--blue-600);}
/* Form controls (button/input/select/textarea) do NOT automatically
   inherit color/font from the page in every browser's UA stylesheet —
   this is a well-known CSS gotcha. Without this rule, a <button> with no
   explicit `color` declared falls back to the browser/OS default button
   text color, which is exactly what produced invisible tile labels. */
button,input,select,textarea{font-family:inherit; color:inherit;}
code,.mono{font-family:var(--mono);}
::selection{background:var(--blue-100);}
:focus-visible{outline:2.5px solid var(--blue-500); outline-offset:2px; border-radius:3px;}

/* ---------- shell ---------- */
#app{min-height:100vh; display:flex; flex-direction:column;}

.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:12px 22px; background:var(--navy-900); color:var(--white);
  position:sticky; top:0; z-index:50; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:11px; cursor:pointer; background:none; border:none; padding:4px 0; color:inherit;}
.brand .name{font-weight:800; font-size:19px; letter-spacing:-0.01em; color:var(--white);}
.brand .tag{font-size:11px; color:#AEBBDA; display:none; border-left:1px solid #33447A; padding-left:11px; margin-left:1px;}
@media(min-width:700px){.brand .tag{display:inline;}}

.topbar-actions{display:flex; align-items:center; gap:10px;}
.mode-toggle{display:flex; align-items:center; background:var(--navy-800); border-radius:999px; padding:3px; flex:none;}
.mode-toggle button{
  background:transparent; border:none; padding:6px 13px; font-size:12px; font-weight:600; cursor:pointer;
  color:#B9C4DE; border-radius:999px; letter-spacing:0.01em;
}
.mode-toggle button.active{background:var(--blue-500); color:#fff;}
.btn-ghost-topbar{
  background:transparent; border:1.5px solid #35437A; color:#fff; padding:7px 14px; border-radius:999px;
  font-size:12.5px; font-weight:600; cursor:pointer;
}
.btn-ghost-topbar:hover{background:var(--navy-800);}

.shell{display:flex; flex:1; min-height:0;}
.railnav{
  width:76px; flex:none; background:var(--white); border-right:1px solid var(--line);
  padding:16px 0; display:flex; flex-direction:column; align-items:center; gap:4px;
}
.railnav button{
  width:58px; display:flex; flex-direction:column; align-items:center; gap:3px; background:transparent; border:none;
  padding:9px 4px; border-radius:var(--radius-sm); cursor:pointer; color:var(--ink-faint); font-size:10.5px;
  font-weight:600; letter-spacing:0.01em;
}
.railnav button .ic{font-size:19px; line-height:1;}
.railnav button:hover{background:var(--paper); color:var(--ink-soft);}
.railnav button.active{background:var(--blue-100); color:var(--blue-600);}
@media(max-width:760px){
  .shell{flex-direction:column;}
  .railnav{width:100%; flex-direction:row; justify-content:flex-start; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); padding:8px 8px;}
  .railnav button{flex:none;}
}

.main{flex:1; min-width:0; padding:30px 28px 90px;}
.wrap{max-width:980px; margin:0 auto;}
.wrap-wide{max-width:1180px; margin:0 auto;}
@media(max-width:640px){.main{padding:18px 14px 60px;}}

/* ---------- logo ---------- */
.tc-logo-mark{flex:none; display:block; overflow:visible;}
.tc-logo-full{vertical-align:middle;}

/* ---------- headings ---------- */
.kicker{font-size:12px; font-weight:700; letter-spacing:0.04em; color:var(--blue-600); margin-bottom:8px;}
h1.page-title{font-size:28px; font-weight:800; letter-spacing:-0.015em; margin-bottom:6px;}
.lede{font-size:15.5px; color:var(--ink-soft); max-width:58ch;}

/* ---------- hero ---------- */
.hero{
  background:linear-gradient(135deg, var(--navy-950), var(--navy-800) 65%, #1B3A6B);
  color:#fff; border-radius:var(--radius-lg); padding:34px 30px; margin-bottom:24px;
  display:flex; gap:26px; align-items:center; flex-wrap:wrap; position:relative; overflow:hidden;
}
.hero::after{
  content:''; position:absolute; right:-60px; top:-60px; width:260px; height:260px; border-radius:50%;
  background:radial-gradient(circle, rgba(62,110,240,0.35), transparent 70%);
}
.hero-copy{flex:1; min-width:260px; position:relative; z-index:1;}
.hero h1{font-size:27px; font-weight:800; letter-spacing:-0.015em; margin-bottom:10px; max-width:20ch;}
.hero p{color:#C7D1EB; max-width:52ch; font-size:14.5px;}
.hero .btn{margin-top:14px;}
.hero-stats{display:flex; gap:22px; position:relative; z-index:1; flex-wrap:wrap;}
.hero-stat{min-width:96px;}
.hero-stat .n{font-size:24px; font-weight:800; font-family:var(--mono);}
.hero-stat .l{font-size:11px; color:#9FAFD6; margin-top:2px;}
.hero-stat .n.risk-high{color:#FF9C90;}
.hero-stat .n.risk-medium{color:#F6CE7A;}
.hero-stat .n.risk-low{color:#8CE0B4;}

/* ---------- panels / cards ---------- */
.panel{
  background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px;
  margin-bottom:18px; box-shadow:var(--shadow-sm);
}
.panel + .panel{margin-top:18px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px;}
.panel h3.section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:12px;}
.hr{border:none; border-top:1px solid var(--line); margin:14px 0;}

.field-row{
  display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;
}
.field-row:last-child{border-bottom:none;}
.field-row .k{color:var(--ink-faint); flex:none; min-width:170px; font-weight:600;}
.field-row .v{color:var(--ink); word-break:break-word; flex:1; font-family:var(--mono); font-size:12.5px;}

/* ---------- quick action tiles ---------- */
.tilegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px;}
.tile{
  border:1px solid var(--line); background:var(--white); border-radius:var(--radius); padding:17px;
  cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:7px; transition:border-color .12s, box-shadow .12s, transform .12s;
}
.tile:hover{border-color:var(--blue-500); box-shadow:var(--shadow-md); transform:translateY(-1px);}
.tile .ti-icon{
  width:38px; height:38px; border-radius:9px; background:var(--blue-100); color:var(--blue-600);
  display:flex; align-items:center; justify-content:center; font-size:18px;
}
.tile .ti-name{display:block; font-weight:700; font-size:14.5px; color:var(--ink); margin-top:2px;}
.tile .ti-desc{display:block; font-size:11.5px; color:var(--ink-faint); line-height:1.5;}

/* ---------- forms ---------- */
label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
textarea,input[type=text],input[type=tel],input[type=url],input[type=search]{
  width:100%; border:1.5px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--white);
  padding:10px 12px; font-family:var(--sans); font-size:14px; color:var(--ink); resize:vertical;
}
textarea{font-family:var(--mono); font-size:13px;}
textarea:focus,input:focus{outline:none; border-color:var(--blue-500); box-shadow:0 0 0 3px var(--blue-100);}
.field{margin-bottom:16px;}
.dropzone{
  border:1.5px dashed var(--line-strong); background:var(--paper); border-radius:var(--radius);
  padding:28px 16px; text-align:center; cursor:pointer; font-size:12.5px; color:var(--ink-soft); display:block;
}
.dropzone:hover{border-color:var(--blue-500); background:var(--blue-100);}
.dropzone input{display:none;}
.dropzone .dz-icon{font-size:24px; display:block; margin-bottom:8px;}
.preview-img{max-width:100%; max-height:220px; border-radius:var(--radius-sm); border:1px solid var(--line); margin-top:10px; display:block;}

.btn{
  display:inline-flex; align-items:center; gap:8px; background:var(--blue-600); color:#fff; border:none;
  border-radius:999px; padding:10px 19px; font-size:13.5px; font-weight:700; cursor:pointer; letter-spacing:0.005em;
}
.btn:hover{background:#2148B8;}
.btn:disabled{opacity:0.5; cursor:default;}
.btn.secondary{background:var(--white); color:var(--ink); border:1.5px solid var(--line-strong);}
.btn.secondary:hover{background:var(--paper); border-color:var(--ink-faint);}
.btn.danger{background:var(--white); color:var(--red); border:1.5px solid var(--red);}
.btn.danger:hover{background:var(--red-bg);}
.emergency-btn{background:var(--red); box-shadow:0 2px 10px rgba(194,57,52,0.35);}
.emergency-btn:hover{background:#A62E29;}
.btn.sm{padding:7px 13px; font-size:12px;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}

/* ---------- verdict ---------- */
.verdict-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}
.risk-banner{
  border-radius:var(--radius); padding:16px 20px; display:flex; align-items:center; gap:16px; margin-bottom:6px;
}
.risk-banner.risk-high{background:var(--red-bg);}
.risk-banner.risk-medium{background:var(--amber-bg);}
.risk-banner.risk-low{background:var(--green-bg);}
.risk-banner.risk-unknown{background:var(--grey-bg);}
.risk-glyph{
  width:46px; height:46px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  font-size:22px; font-weight:800; color:#fff;
}
.risk-glyph.risk-high{background:var(--red);}
.risk-glyph.risk-medium{background:var(--amber);}
.risk-glyph.risk-low{background:var(--green);}
.risk-glyph.risk-unknown{background:var(--grey);}
.risk-banner .rb-label{font-weight:800; font-size:16.5px;}
.risk-banner.risk-high .rb-label{color:var(--red);}
.risk-banner.risk-medium .rb-label{color:var(--amber);}
.risk-banner.risk-low .rb-label{color:var(--green);}
.risk-banner.risk-unknown .rb-label{color:var(--grey);}
.risk-banner .rb-score{font-family:var(--mono); font-size:13px; color:var(--ink-soft);}
.rb-confidence{font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); margin-top:3px;}

.meter{height:8px; background:var(--line); border-radius:99px; position:relative; margin:14px 0 4px; overflow:hidden;}
.meter .fill{height:100%; border-radius:99px;}
.meter .fill.risk-high{background:var(--red);}
.meter .fill.risk-medium{background:var(--amber);}
.meter .fill.risk-low{background:var(--green);}
.meter .fill.risk-unknown{background:var(--grey);}
.meter-ticks{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-faint); margin-bottom:6px; font-family:var(--mono);}

.flag-list{list-style:none; margin:0; padding:0;}
.flag-list li{padding:10px 0 10px 26px; border-bottom:1px solid var(--line); position:relative; font-size:13.5px;}
.flag-list li:last-child{border-bottom:none;}
.flag-list li::before{content:"!"; position:absolute; left:0; top:9px; width:16px; height:16px; border-radius:50%; background:var(--red); color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.flag-list.safe li::before{content:"–"; background:var(--green);}
.flag-list li .flag-detail{color:var(--ink-faint); font-size:11.5px; display:block; margin-top:3px; font-family:var(--mono);}
.flag-list li .flag-weight{float:right; font-family:var(--mono); font-size:11px; color:var(--ink-faint);}

.contrib-row{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12.5px;}
.contrib-row .cl{flex:none; width:150px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.contrib-bar{flex:1; height:8px; background:var(--line); border-radius:99px; overflow:hidden;}
.contrib-bar .f{display:block; height:100%; background:var(--blue-500); border-radius:99px;}
.contrib-row .cn{flex:none; width:28px; text-align:right; font-family:var(--mono); color:var(--ink-faint); font-size:11px;}

.tag{display:inline-block; font-size:10.5px; font-weight:600; border-radius:999px; background:var(--blue-100); color:var(--blue-600); padding:3px 10px; margin:0 6px 6px 0;}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px;}
.badge.risk-high{color:var(--red); background:var(--red-bg);}
.badge.risk-medium{color:var(--amber); background:var(--amber-bg);}
.badge.risk-low{color:var(--green); background:var(--green-bg);}
.badge.risk-unknown{color:var(--grey); background:var(--grey-bg);}
.badge.neutral{color:var(--ink-soft); background:var(--paper);}
.badge .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}

/* ---------- stat cards ---------- */
.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px;}
.statcard{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-sm);}
.statcard .sv{font-family:var(--mono); font-size:23px; font-weight:700;}
.statcard .sl{font-size:12px; color:var(--ink-faint); margin-top:3px;}
.statcard.risk-high .sv{color:var(--red);}
.statcard.risk-medium .sv{color:var(--amber);}
.statcard.risk-low .sv{color:var(--green);}

/* ---------- Scam DNA / confidence / status / radar / emergency ---------- */
.dna-row{display:flex; align-items:center; gap:10px; padding:7px 0; font-size:12.5px;}
.dna-row .dl{flex:none; width:150px; color:var(--ink-soft); font-weight:600;}
.dna-bar{flex:1; height:9px; background:var(--line); border-radius:99px; overflow:hidden;}
.dna-bar .f{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg, var(--teal-500), var(--blue-600));}
.dna-row .dn{flex:none; width:38px; text-align:right; font-family:var(--mono); color:var(--ink-faint); font-size:11px;}
.dna-family{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--paper); border-radius:var(--radius-sm); padding:13px 15px; margin-top:14px; flex-wrap:wrap;}
.dna-family .df-name{font-weight:800; font-size:14.5px;}
.dna-family .df-conf{font-family:var(--mono); font-size:12px; color:var(--ink-faint);}

.confidence-row{display:flex; gap:22px; flex-wrap:wrap; margin-top:2px;}
.confidence-item{flex:1; min-width:150px;}
.confidence-item .ci-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:4px;}
.confidence-item .ci-value{font-family:var(--mono); font-weight:800; font-size:20px;}

.status-pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 11px; border-radius:999px; background:var(--blue-100); color:var(--blue-600); border:none; cursor:pointer;}
.status-pill.is-active{background:var(--navy-900); color:#fff;}
.status-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}

.why-toggle{background:none; border:none; color:var(--blue-600); font-size:11px; font-weight:700; cursor:pointer; padding:0; margin-left:8px;}
.why-box{display:none; background:var(--paper); border-radius:8px; padding:9px 11px; margin-top:6px; font-size:12px; color:var(--ink-soft); font-family:var(--sans);}
.why-box.open{display:block;}

.radar-card{border:1px solid var(--line); border-radius:var(--radius); padding:18px 19px; margin-bottom:14px;}
.radar-card .rc-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
.radar-card .rc-title{font-weight:800; font-size:15.5px;}
.radar-card .rc-section{margin-top:10px;}
.radar-card .rc-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:5px;}
.demo-flag{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; background:var(--amber-bg); color:var(--amber); padding:3px 10px; border-radius:999px; margin-bottom:14px;}

/* ---------- provider / source-freshness badges ---------- */
.source-badge{display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; padding:3px 9px; border-radius:999px;}
.source-badge.live{background:var(--green-bg); color:var(--green);}
.source-badge.demo{background:var(--amber-bg); color:var(--amber);}
.source-badge.community{background:var(--blue-100); color:var(--blue-600);}
.source-badge.historical{background:var(--grey-bg); color:var(--grey);}
.source-badge.notconfigured{background:var(--grey-bg); color:var(--grey);}
.provider-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; flex-wrap:wrap;}
.provider-row:last-child{border-bottom:none;}
.provider-row .pr-name{font-weight:700;}
.provider-row .pr-meta{font-size:11.5px; color:var(--ink-faint); font-family:var(--mono);}

/* ---------- evidence quality / verification ---------- */
.eq-row{display:flex; gap:22px; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong);}
.eq-item{flex:1; min-width:140px;}
.eq-item .eq-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:3px;}
.eq-item .eq-value{font-weight:800; font-size:14px;}
.verification-line{display:flex; align-items:center; gap:8px; margin-top:12px; padding:9px 12px; background:rgba(0,0,0,0.035); border-radius:8px; font-size:12px; font-weight:700; color:var(--ink-soft); letter-spacing:0.01em;}
.verification-line .vl-dot{width:8px; height:8px; border-radius:50%; background:var(--grey); flex:none;}
.insufficient-box{background:var(--grey-bg); border-radius:var(--radius-sm); padding:14px 16px; margin-top:12px; font-size:13px; color:var(--ink-soft);}
.insufficient-box ul{margin:8px 0 0; padding-left:18px;}
.insufficient-box li{margin-bottom:4px;}

/* ---------- attack chain ---------- */
.chain-row{display:flex; flex-wrap:wrap; gap:0; align-items:stretch; margin-top:4px;}
.chain-step{flex:1; min-width:110px; text-align:center; padding:10px 6px; border-radius:8px; background:var(--paper); color:var(--ink-faint); font-size:11px; font-weight:700; position:relative; margin:0 3px 8px;}
.chain-step.hit{background:var(--red-bg); color:var(--red);}
.chain-step .cs-ic{display:block; font-size:15px; margin-bottom:3px;}

/* ---------- feedback ---------- */
.feedback-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:4px;}
.feedback-btn{border:1.5px solid var(--line-strong); background:var(--white); color:var(--ink-soft); padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer;}
.feedback-btn:hover{border-color:var(--blue-500);}
.feedback-btn.chosen{background:var(--navy-900); color:#fff; border-color:var(--navy-900);}
.feedback-note{font-size:12px; color:var(--ink-faint); margin-top:8px;}

/* ---------- accessibility helpers ---------- */
.skip-link{position:absolute; left:-999px; top:auto; background:var(--blue-600); color:#fff; padding:10px 16px; border-radius:6px; z-index:200; font-weight:700; font-size:13px;}
.skip-link:focus{left:10px; top:10px;}
.visually-hidden{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

/* ---------- docs page ---------- */
.doc-toc{display:flex; flex-wrap:wrap; gap:8px 16px;}
.doc-toc-link{font-size:12.5px; font-weight:700; color:var(--blue-600); text-decoration:none; padding:5px 12px; border:1.5px solid var(--line-strong); border-radius:999px;}
.doc-toc-link:hover{border-color:var(--blue-500); background:var(--blue-100);}
.doc-body p{color:var(--ink-soft); font-size:13.5px; line-height:1.7; margin:0 0 10px;}
.doc-body ul{margin:0 0 10px; padding-left:20px; color:var(--ink-soft); font-size:13.5px; line-height:1.7;}
.doc-body code{background:var(--paper); padding:1px 6px; border-radius:4px; font-family:var(--mono); font-size:12px;}

.emergency-tile{border:1.5px solid var(--line-strong); background:var(--white); color:var(--ink); border-radius:var(--radius); padding:14px 16px; cursor:pointer; text-align:left; font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:10px;}
.emergency-tile:hover{border-color:var(--red); background:var(--red-bg); color:var(--red);}
.emergency-tile.selected{border-color:var(--red); background:var(--red-bg); color:var(--red);}
.emergency-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-bottom:20px;}

.entity-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
.entity-row:last-child{border-bottom:none;}
.entity-row .ek{font-family:var(--mono); font-size:12px; color:var(--ink);}
.entity-row .ev{font-size:11px; color:var(--ink-faint);}

/* ---------- case rows ---------- */
.case-row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); cursor:pointer;}
.case-row:hover{background:var(--paper); margin:0 -12px; padding-left:12px; padding-right:12px; border-radius:8px;}
.case-row:last-child{border-bottom:none;}
.case-main .ct{font-weight:700; font-size:14.5px;}
.case-main .cm{font-size:11.5px; color:var(--ink-faint); margin-top:3px; font-family:var(--mono);}
.case-right{display:flex; align-items:center; gap:10px; flex:none;}
.empty-state{padding:40px 10px; text-align:center; color:var(--ink-faint); font-size:13.5px;}
.empty-state .es-icon{font-size:30px; display:block; margin-bottom:12px;}

.filter-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.filter-row input[type=search]{max-width:260px;}
.chip-filter{display:flex; gap:6px; flex-wrap:wrap;}
.chip-filter button{
  border:1.5px solid var(--line-strong); background:var(--white); border-radius:999px; padding:6px 12px;
  font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer;
}
.chip-filter button.active{background:var(--navy-900); border-color:var(--navy-900); color:#fff;}

/* ---------- tabs ---------- */
.tabbar{display:flex; gap:4px; border-bottom:1.5px solid var(--line); margin-bottom:18px;}
.tabbar button{
  background:transparent; border:none; padding:10px 6px; margin-right:16px; font-size:13.5px; font-weight:700;
  color:var(--ink-faint); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1.5px;
}
.tabbar button.active{color:var(--blue-600); border-bottom-color:var(--blue-600);}

/* ---------- timeline ---------- */
.timeline{list-style:none; margin:0; padding:0; position:relative;}
.timeline li{padding:0 0 20px 26px; position:relative;}
.timeline li:last-child{padding-bottom:0;}
.timeline li::before{content:''; position:absolute; left:4px; top:4px; width:9px; height:9px; border-radius:50%; background:var(--blue-500); border:2px solid #fff; box-shadow:0 0 0 1px var(--blue-500);}
.timeline li::after{content:''; position:absolute; left:8px; top:14px; bottom:0; width:1.5px; background:var(--line);}
.timeline li:last-child::after{display:none;}
.timeline .tl-t{font-size:11px; color:var(--ink-faint); font-family:var(--mono); margin-bottom:2px;}
.timeline .tl-d{font-size:13.5px; font-weight:600;}

/* ---------- steps (how it works) ---------- */
.steps{display:flex; flex-direction:column; gap:0;}
.step-row{display:flex; gap:16px; padding:16px 0; border-bottom:1px solid var(--line);}
.step-row:last-child{border-bottom:none;}
.step-num{
  flex:none; width:34px; height:34px; border-radius:50%; background:var(--blue-100); color:var(--blue-600);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--mono); font-size:13px;
}
.step-body .st{font-weight:700; font-size:14.5px; margin-bottom:3px;}
.step-body .sd{font-size:13px; color:var(--ink-soft); margin:0;}

/* ---------- safety tips ---------- */
.tip-card{background:var(--paper); border-radius:var(--radius); padding:15px 17px; margin-bottom:10px; border-left:3px solid var(--blue-500);}
.tip-card .tt{font-weight:700; font-size:13.5px; margin-bottom:3px;}
.tip-card .td{font-size:12.5px; color:var(--ink-soft); margin:0;}

/* ---------- misc ---------- */
.note{font-size:12px; color:var(--ink-faint); border-left:2.5px solid var(--line-strong); padding-left:11px; margin:14px 0; background:var(--paper); border-radius:0 8px 8px 0; padding-top:8px; padding-bottom:8px;}
.hint{font-size:11.5px; color:var(--ink-faint); margin-top:-10px; margin-bottom:14px;}
.raw-json{background:var(--navy-950); color:#B9E5D8; border-radius:var(--radius-sm); padding:14px; font-size:11px; overflow:auto; white-space:pre-wrap; word-break:break-word; max-height:340px; margin-top:10px; font-family:var(--mono);}
details summary{cursor:pointer; font-size:12.5px; color:var(--blue-600); margin-top:10px; font-weight:600;}
.spinner-row{display:flex; align-items:center; gap:10px; color:var(--ink-soft); font-size:12.5px; padding:12px 0;}
.dot-pulse{width:8px; height:8px; background:var(--blue-500); border-radius:50%; animation:pulse 1s infinite ease-in-out;}
@keyframes pulse{0%,100%{opacity:0.25; transform:scale(0.85);}50%{opacity:1; transform:scale(1);}}
.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--navy-900); color:#fff;
  padding:11px 20px; font-size:12.5px; border-radius:999px; z-index:100; box-shadow:var(--shadow-md); font-weight:600;
}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media(max-width:640px){.grid-2{grid-template-columns:1fr;} .hero{padding:26px 20px;}}
.recommend-list{list-style:none; margin:0; padding:0;}
.recommend-list li{padding:9px 0 9px 26px; position:relative; font-size:13.5px; border-bottom:1px solid var(--line);}
.recommend-list li:last-child{border-bottom:none;}
.recommend-list li.do::before{content:"✓"; position:absolute; left:0; color:var(--green); font-weight:800;}
.recommend-list li.dont::before{content:"✕"; position:absolute; left:0; color:var(--red); font-weight:800;}

.footer-note{text-align:center; font-size:11.5px; color:var(--ink-faint); margin-top:30px; padding-top:18px; border-top:1px solid var(--line);}

@media print{
  .topbar,.railnav,.btn-row,.mode-toggle,.tabbar,.filter-row{display:none !important;}
  .main{max-width:100%; padding:0;}
  body{background:#fff;}
  .panel{border:1px solid #000; box-shadow:none; break-inside:avoid;}
  .hero{background:#0E1D3A !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
}

<script>
/* =========================================================================
   TRUSTCHAIN — client-side heuristic scam / digital-evidence verification.
   Runs entirely in the browser. Nothing you submit is uploaded anywhere
   except the one-time CDN fetches needed to load fonts/libraries. Risk
   scoring is a transparent, rule-based heuristic model — not a connection
   to a live threat-intelligence database. That is stated throughout the UI.
   ========================================================================= */
window.TC = window.TC || {};
/* Versioning for reproducibility: every evidence item records which
   ruleset/model/engine build produced it (see finalizeEvidence and
   evidenceItemPanel). Bump these when the rule set, weights, or ML model
   change so past results remain interpretable against the version that
   generated them. */
window.TC.ENGINE_VERSION = { engine:'2.1.0', ruleset:'2026-09-19', model: 'naive-bayes-trustchain-synthetic-1.0-v2' };

(function(){
"use strict";
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function el(html){ var t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function fmtDate(iso){
  var d = new Date(iso);
  return d.toLocaleString(undefined,{ day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtDateShort(iso){
  var d = new Date(iso);
  return d.toLocaleDateString(undefined,{ day:'2-digit', month:'short' });
}
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
/* Cryptographically-random identifier. Falls back to Math.random only in the
   (very rare) environment lacking crypto.getRandomValues, and is never used
   for anything security-sensitive in that fallback case. */
function uid(len){
  len = len || 4;
  if (window.crypto && crypto.getRandomValues){
    var bytes = new Uint8Array(Math.ceil(len/2));
    crypto.getRandomValues(bytes);
    return Array.from(bytes).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('').slice(0,len);
  }
  return Math.random().toString(16).slice(2,2+len);
}
function pad(n){ return n<10 ? '0'+n : ''+n; }
function makeCaseId(){
  var d=new Date();
  var suffix = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().split('-')[0].toUpperCase() : uid(8).toUpperCase();
  return 'TC-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+'-'+suffix;
}
function levenshtein(a,b){
  a=(a||'').toLowerCase(); b=(b||'').toLowerCase();
  var m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  var dp=[]; for(var i=0;i<=m;i++){ dp[i]=[i]; }
  for(var j=0;j<=n;j++){ dp[0][j]=j; }
  for(i=1;i<=m;i++){
    for(j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    }
  }
  return dp[m][n];
}
async function sha256Hex(bytesOrString){
  var buf;
  if (typeof bytesOrString === 'string'){ buf = new TextEncoder().encode(bytesOrString); }
  else { buf = bytesOrString; }
  var digest = await crypto.subtle.digest('SHA-256', buf);
  var arr = Array.from(new Uint8Array(digest));
  return arr.map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}
function extractUrls(text){
  var re = /\b((?:https?:\/\/|www\.)[^\s"'<>()]+)/gi;
  var out = [], m;
  while((m = re.exec(text)) && out.length < 6){
    var u = m[1].replace(/[.,;:!?)]+$/,'');
    if (out.indexOf(u) === -1) out.push(u);
  }
  return out;
}
function normalizeUrl(u){
  if(!/^https?:\/\//i.test(u)) u = 'http://' + u;
  return u;
}
/* Privacy-by-design: mask likely OTPs and card numbers before they are ever
   rendered on screen, printed in a report, or exported as JSON — even
   though the SHA-256 hash of the original evidence is still computed on
   the unmasked source, so evidence integrity is unaffected. */
function maskSensitive(text){
  if (!text) return text;
  var out = String(text);
  out = out.replace(/\b(otp|one[- ]time password|verification code|security code)\b([\s:.\-]{0,12})(\d{4,8})\b/gi, function(m, label, mid, digits){
    return label + mid + '\u2022'.repeat(digits.length);
  });
  out = out.replace(/\b(?:\d[ -]?){13,19}\b/g, function(m){
    var digits = m.replace(/[^\d]/g,'');
    if (digits.length < 13 || digits.length > 19) return m;
    var last4 = digits.slice(-4);
    var groups = Math.max(1, Math.ceil((digits.length-4)/4));
    var masked = [];
    for (var i=0;i<groups;i++){ masked.push('\u2022\u2022\u2022\u2022'); }
    masked.push(last4);
    return masked.join(' ');
  });
  return out;
}
function downloadBlob(filename, content, mime){
  var blob = new Blob([content], { type: mime || 'application/octet-stream' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
/* Builds the JSON export payload for a case. Redacted (default) strips
   the rawText field every evidence item carries (the on-screen fields are
   already masked at creation time via maskSensitive, so redacted export
   is simply "what you already see"). Full includes rawText verbatim, so
   the export ships with export-time metadata, a clear label of which
   mode was used, and the same limitations/disclaimer language shown
   throughout the app, per spec: exports should never look more
   authoritative than the underlying analysis actually is. */
function buildExportPayload(caseObj, full){
  var clone = JSON.parse(JSON.stringify(caseObj));
  if (clone.evidenceItems){
    clone.evidenceItems.forEach(function(item){
      if (!full){ delete item.rawText; }
    });
  }
  return {
    exportMode: full ? 'FULL_EVIDENCE_UNREDACTED' : 'REDACTED',
    generatedAt: new Date().toISOString(),
    generatedBy: window.TC.ENGINE_VERSION,
    disclaimer: 'TrustChain is a decision-support and evidence-analysis tool, not an infallible authority. Every score and verdict in this export is based on pattern-based heuristics and/or a synthetically-trained language model — see each item\u2019s "confidence"/"evidenceQuality" fields and the app\u2019s "How it works" page for what was and was not verified. ' +
      (full ? 'This export includes UNREDACTED original text (phone numbers, UPI IDs, emails, names, etc. are NOT masked) \u2014 handle and share it accordingly.' : 'Sensitive fields have been masked in this export.'),
    case: clone
  };
}
function copyText(str){
  if (navigator.clipboard && navigator.clipboard.writeText){ return navigator.clipboard.writeText(str); }
  return new Promise(function(resolve){
    var ta = document.createElement('textarea'); ta.value = str; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    ta.remove(); resolve();
  });
}

Object.assign(window.TC, {
  escapeHtml: escapeHtml, el: el, fmtDate: fmtDate, fmtDateShort: fmtDateShort, clamp: clamp, uid: uid,
  makeCaseId: makeCaseId, levenshtein: levenshtein, sha256Hex: sha256Hex,
  extractUrls: extractUrls, normalizeUrl: normalizeUrl, downloadBlob: downloadBlob, copyText: copyText,
  buildExportPayload: buildExportPayload,
  maskSensitive: maskSensitive
});
})();
</script>

<script>
/* ---------------------------------------------------------------------- */
/* Logo — TrustChain brand mark, implemented as inline scalable SVG.      */
/* No raster image, no external asset, no base64 photo data. The mark is  */
/* a shield (protection) built from a single unbroken link-chain stroke   */
/* (the "trust chain" of verified evidence), with a checkmark notch cut   */
/* from the same continuous line. Pure vector: identical sharpness at any */
/* size, any pixel density, and any browser zoom level.                  */
/* ---------------------------------------------------------------------- */
(function(){
"use strict";

/* Icon-only mark: a shield silhouette with a chain-link + check motif.
   size = rendered CSS pixel size (square). onDark = true when placed on
   the navy header/hero background (adjusts stroke contrast only — the
   shield fill always uses currentColor-independent brand blue so the
   mark stays recognizable in both contexts). */
function markSvg(size, opts){
  opts = opts || {};

  var fillA = opts.onDark ? '#3E6EF0' : '#2A57D6';

  var uid = 'tcg' + Math.random().toString(36).slice(2,8);
  return ''+
  '<svg class="tc-logo-mark" width="'+size+'" height="'+size+'" viewBox="0 0 48 48" '+
       'xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="'+uid+'-t" focusable="false">'+
    '<title id="'+uid+'-t">TrustChain shield logo</title>'+
    '<defs>'+
      '<linearGradient id="'+uid+'-g" x1="0" y1="0" x2="1" y2="1">'+
        '<stop offset="0" stop-color="'+fillA+'"/>'+
        '<stop offset="1" stop-color="'+fillB+'"/>'+
      '</linearGradient>'+
    '</defs>'+
    '<path d="M24 3.2 L41 9.6 V21.8 C41 32.9 34.2 41.4 24 44.8 C13.8 41.4 7 32.9 7 21.8 V9.6 Z" '+
          'fill="url(#'+uid+'-g)"/>'+
    '<path d="M24 3.2 L41 9.6 V21.8 C41 32.9 34.2 41.4 24 44.8 C13.8 41.4 7 32.9 7 21.8 V9.6 Z" '+
          'fill="none" stroke="rgba(8,18,38,0.18)" stroke-width="1"/>'+
    '<path d="M16.2 24.6 L21.4 29.8 L32.2 18" fill="none" stroke="'+stroke+'" '+
          'stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>'+
  '</svg>';
}

/* Icon + wordmark lockup, used in the header/nav and print/export headers.

   and the wordmark is set in the app's own type (Manrope), never an
   image, so it stays crisp and theme-colorable at any size. */
function fullSvg(w, opts){

  var h = Math.round(w * (opts.tagline===false ? 0.26 : 0.34));
  return ''+
  '<span class="tc-logo-full" style="display:inline-flex; align-items:center; gap:'+Math.round(markSize*0.32)+'px; width:'+w+'px;">'+

   the offline Python training pipeline exactly. The PREVIOUS tokenizer was
   ASCII-only ([a-z0-9...]) and silently dropped 100% of Devanagari text —

   effectively blind on Hindi messages. \p{L}\p{M}\p{N} (Unicode property
   escapes, supported in all evergreen browsers since ~2018) fixes this by
   keeping combining vowel signs (matras) attached to their base letter, so
   "आपका" tokenizes as one token instead of being corrupted. Falls back to
   the old ASCII-only pattern on the rare browser without Unicode property
   escape support (the language-model signal degrades gracefully to
   English/Latin-script-only there; every other feature is unaffected). */
var TOKEN_RE;

  var toks = lower.match(TOKEN_RE) || [];
  var withBigrams = toks.slice();

    legit += c * MODEL.legit_log_prob[i];
    scam += c * MODEL.scam_log_prob[i];

  var el = Math.exp(legit - m), es = Math.exp(scam - m);
  var p = es / (el + es);

function analyzeText(rawText){

  var hasProtectivePhrase = PROTECTIVE_PHRASES.some(function(p){ return lower.indexOf(p)!==-1; });
  var hasSolicitingPhrase = SOLICITING_OTP_PHRASES.some(function(p){ return lower.indexOf(p)!==-1; });

    // the reader of an OTP and tells them to keep it safe (e.g. a real bank's
    // OTP SMS) rather than asking them to hand it over. Only suppress this
    // when the bare "otp" term is the sole match and no explicit solicitation
    // phrase is present.
    if (sig.id === 'credential' && matched.length === 1 && matched[0] === 'otp' && hasProtectivePhrase && !hasSolicitingPhrase){

  if (text.length >= 12 && window.TC.MLModel){

function hostnameCore(hostname){ return hostname.replace(/^www\./,''); }

function analyzeUrl(rawUrl){
  var indicators = [];

  var u;

  }

    indicators.push({ id:'url_port', category:'url', label:'Uses a non-standard network port ('+u.port+'), unusual for a legitimate consumer-facing site', weight:10, detail: ':'+u.port });
  }

    indicators.push({ id:'url_credentials', category:'url', label:'URL has a username/password embedded before the domain \\u2014 a technique used to disguise the real destination', weight:22, detail: host });
  }

  Object.keys(U.BRANDS).forEach(function(key){
    if (brandHit) return;
    var brand = U.BRANDS[key];
    var isOfficial = brand.domains.some(function(d){ return host===d || host.endsWith('.'+d); });
    if (isOfficial) return;
    var containsBrand = host.indexOf(key) !== -1;
    var sldLabel = labels.length>=2 ? labels[labels.length-2] : host;
    var closeTypo = U.levenshtein(sldLabel, key) <= 1 && key.length >= 4;
    // Also check each hyphen/digit-separated token within the SLD, so
    // "amazon-kyc.tk" or "paypal-verify-login.xyz" is caught even though
    // the FULL label ("amazon-kyc") is nowhere near a 1-character typo of
    // "amazon" — this pattern (real brand name + scam-themed suffix on an
    // unrelated domain) is far more common in the wild than single-char
    // domain typosquats, and the previous whole-label-only check missed it.

/* UPI status is deliberately never "VERIFIED" — no live payment-reputation

function analyzeUpi(rawId){
  var id = (rawId||'').trim();
  var indicators = [];
  var info = { raw:id, valid:false, handle:null, local:null, status:'UNVERIFIED' };
  var m = id.match(/^([\w.\-]{2,})@([a-zA-Z][\w]{1,})$/);

    indicators.push({ id:'upi_format', category:'upi', label:'Does not match the standard name@bank UPI ID format', weight:10, detail: id });

  info.valid = true; info.local = m[1]; info.handle = m[2].toLowerCase();
  if (U.KNOWN_UPI_HANDLES.indexOf(info.handle) === -1){
    indicators.push({ id:'upi_handle', category:'upi', label:'Uses an uncommon payment-service handle not among widely recognized UPI providers', weight:12, detail: '@'+info.handle });
  }
  var localLower = info.local.toLowerCase();
  var brandWordHit = U.BRAND_WORDS_FOR_UPI.filter(function(w){ return localLower.indexOf(w) !== -1; });

    indicators.push({ id:'upi_impersonation', category:'upi', label:'Username references "'+brandWordHit[0]+'" but the handle does not clearly belong to that organization', weight:18, detail: id });

}

  return COUNTRIES.filter(function(c){ return c.code === code; })[0] || COUNTRIES[0];
}
function analyzePhone(rawNumber, countryCode){
  var country = findCountry(countryCode || 'IN');
  var digits = (rawNumber||'').replace(/[^\d]/g,'');
  var indicators = [];
  var info = { raw: rawNumber, digits: digits, country: country.code, countryName: country.name };
  var core = digits;
  if (country.dial && digits.length > country.max && digits.indexOf(country.dial) === 0){
    core = digits.slice(country.dial.length);
  }
  var standard = country.pattern.test(core);
  info.looksStandardFormat = standard;
  info.looksStandardIndianMobile = country.code === 'IN' ? standard : null; // kept for backward compatibility
  if (!standard){
    indicators.push({ id:'phone_format', category:'phone', label:'Does not match the standard mobile number format for '+country.name, weight:8, detail: digits||'(no digits found)' });
  }
  if (/^(\d)\1{5,}$/.test(core) || /0123456|123456|234567|345678|456789|987654|876543/.test(core)){
    indicators.push({ id:'phone_pattern', category:'phone', label:'Digit pattern (repeating or sequential) often seen in randomly generated or spoofed numbers', weight:10, detail: core });
  }
  return { indicators: indicators, info: info };
}

function analyzeQrPayload(text){
  var payload = (text||'').trim();
  var indicators = [];
  var sub = { kind:'text', detail:null };
  if (/^upi:\/\//i.test(payload)){
    sub.kind = 'upi';
    var qIndex = payload.indexOf('?');
    var params = new URLSearchParams(qIndex!==-1 ? payload.slice(qIndex+1) : '');
    var pa = params.get('pa')||''; var pn = params.get('pn')||''; var am = params.get('am');
    sub.detail = { payee: pa, payeeName: pn, amount: am };
    if (pa){
      var upiRes = analyzeUpi(pa);
      indicators = indicators.concat(upiRes.indicators.map(function(ind){ return Object.assign({}, ind, { category:'qr' }); }));
    }
    if (am){
      indicators.push({ id:'qr_amount', category:'qr', label:'QR code requests a pre-filled payment amount (\u20b9'+am+') \u2014 unusual for a standard receive-money QR code', weight:10, detail: '\u20b9'+am });
    }
  } else if (/^(https?:\/\/|www\.)/i.test(payload)){
    sub.kind = 'url';
    var urlRes = analyzeUrl(payload);
    sub.detail = urlRes.info;
    indicators = urlRes.indicators.map(function(ind){ return Object.assign({}, ind, { category:'qr' }); });
  } else {
    sub.kind = 'text';
    var textRes = analyzeText(payload);
    indicators = textRes.indicators.map(function(ind){ return Object.assign({}, ind, { category:'qr' }); });
  }
  return { indicators: indicators, sub: sub, payload: payload };
}

/* Minimum amount of evidence (characters of extracted/submitted content)
   below which TrustChain will not claim "no risk found" — because the
   honest reading of very little evidence is that there isn't enough to
   judge, not that the item is safe. Absence of evidence is not evidence
   of legitimacy. */
var MIN_EVIDENCE_FOR_VERDICT = 18;

function riskFromIndicators(indicators, evidenceSize){
  var score = 0;
  indicators.forEach(function(i){ score += i.weight; });
  score = U.clamp(Math.round(score), 0, 100);
  var size = evidenceSize || 0;
  var tier;
  if (!indicators.length && size < MIN_EVIDENCE_FOR_VERDICT){
    // Too little was actually submitted/extracted to say anything meaningful,
    // regardless of whether it happens to be zero indicators.
    tier = 'unknown';
  } else if (score >= 75) tier = 'veryhigh';
  else if (score >= 50) tier = 'high';
  else if (score >= 25) tier = 'suspicious';
  else if (score > 0) tier = 'low';
  else tier = 'nosignal'; // score is exactly 0 AND there was enough evidence to check
  // `level` drives the CSS color family and must stay consistent with `tier`
  // (the human-readable label) so a "Suspicious" verdict is never shown in
  // green, and a "Low risk" verdict is never shown in red/amber.
  var level = { unknown:'unknown', nosignal:'low', low:'low', suspicious:'medium', high:'high', veryhigh:'high' }[tier];
  var confidence = computeConfidence(indicators, size, tier);
  var evidenceQuality = computeEvidenceQuality(indicators, size);
  return { score: score, level: level, tier: tier, confidence: confidence, evidenceQuality: evidenceQuality };
}

function computeConfidence(indicators, evidenceSize, tier){
  if (tier === 'unknown') return U.clamp(10 + Math.round((evidenceSize||0)), 5, 30);
  var categories = {};
  indicators.forEach(function(i){ categories[i.category] = true; });
  var catCount = Object.keys(categories).length;
  var sizeFactor = Math.min((evidenceSize||0), 400) / 400 * 22;
  var countFactor = Math.min(indicators.length, 6) * 7;
  var catFactor = Math.min(catCount, 3) * 4;
  var conf = 42 + sizeFactor + countFactor + catFactor;
  return U.clamp(Math.round(conf), 30, 97);
}

/* Evidence Quality is deliberately a SEPARATE axis from Risk Score and
   Confidence: it describes how much usable material TrustChain actually had
   to look at, independent of what conclusion that material led to. A
   "Strong" evidence-quality "No significant risk indicators detected"
   result and a "Weak" evidence-quality one of the same tier mean very
   different things, and collapsing them into one number would hide that. */
function computeEvidenceQuality(indicators, evidenceSize){
  var size = evidenceSize || 0;
  var categories = {}; indicators.forEach(function(i){ categories[i.category] = true; });
  var catCount = Object.keys(categories).length;
  if (size < MIN_EVIDENCE_FOR_VERDICT) return 'insufficient';
  if (size < 60 && catCount <= 1) return 'weak';
  if (size < 200 && catCount <= 2) return 'moderate';
  return 'strong';
}
var EVIDENCE_QUALITY_META = {
  insufficient: { label:'Insufficient', desc:'Too little content was submitted or could be extracted to draw a meaningful conclusion.' },
  weak:         { label:'Weak', desc:'A small amount of content was available, or it triggered checks in only one category.' },
  moderate:     { label:'Moderate', desc:'A reasonable amount of content was available across a couple of check categories.' },
  strong:       { label:'Strong', desc:'Substantial content was available and was checked across multiple categories.' }
};

var VERDICT_META = {
  unknown:   { glyph:'?', label:'Insufficient evidence', emoji:'\u26AA' },
  nosignal:  { glyph:'\u2713', label:'No significant risk indicators detected', emoji:'\u{1F7E2}' },
  low:       { glyph:'\u2713', label:'Low risk', emoji:'\u{1F7E2}' },
  suspicious:{ glyph:'!', label:'Suspicious', emoji:'\u{1F7E1}' },
  high:      { glyph:'!', label:'High risk', emoji:'\u{1F7E0}' },
  veryhigh:  { glyph:'!!', label:'Very high risk', emoji:'\u{1F534}' }
};

var DNA_CATEGORIES = [
  { key:'urgency',   label:'Urgency',            ids:['text_urgency','text_surveillance_pressure'] },
  { key:'impersonation', label:'Impersonation',  ids:['text_authority','url_brand','upi_impersonation'] },
  { key:'payment',   label:'Payment request',    ids:['text_financial','qr_amount','text_recruitment'] },
  { key:'credential',label:'Credential / device access', ids:['text_credential','text_remote_access'] },
  { key:'threat',    label:'Threat / coercion',  ids:['text_threat','text_blackmail'] },
  { key:'investment_fraud', label:'Guaranteed returns', ids:['text_guaranteed_returns'] },
  { key:'pressure',  label:'Emotional pressure', ids:['text_secrecy','text_reward'] }
];
function computeScamDna(indicators){
  var maxSeen = 1;
  var raw = DNA_CATEGORIES.map(function(cat){
    var sum = 0;
    indicators.forEach(function(ind){
      if (cat.ids.some(function(idKey){ return ind.id.indexOf(idKey) !== -1; })) sum += ind.weight;
    });
    if (sum > maxSeen) maxSeen = sum;
    return { key:cat.key, label:cat.label, raw:sum };
  });
  return raw.map(function(r){ return { key:r.key, label:r.label, pct: r.raw ? U.clamp(Math.round((r.raw/ (maxSeen*1.15)) * 100), 8, 100) : 0 }; });
}

/* Attack-chain detection: maps matched indicators onto the common stages of
   a social-engineering scam, purely by which indicator ids are present. This
   is a descriptive re-grouping of the same rule-based indicators already
   computed above — not a separate detector — so it never invents a stage
   that wasn't actually evidenced. */
var ATTACK_CHAIN_STAGES = [
  { key:'contact',    label:'Initial contact',            ids:['text_generic','msg_url','shot_url','doc_url','voice_url'] },
  { key:'authority',  label:'Authority impersonation',    ids:['text_authority','url_brand','upi_impersonation'] },
  { key:'urgency',    label:'Urgency / time pressure',    ids:['text_urgency'] },
  { key:'threat',     label:'Threat or coercion',         ids:['text_threat','text_blackmail','text_surveillance_pressure'] },
  { key:'credential', label:'Credential / device-access request', ids:['text_credential','text_remote_access'] },
  { key:'payment',    label:'Payment or transfer request', ids:['text_financial','qr_amount'] },
  { key:'secrecy',    label:'Secrecy / isolation request', ids:['text_secrecy'] }
];
function buildAttackChain(indicators){
  var ids = (indicators||[]).map(function(i){ return i.id; });
  var stages = ATTACK_CHAIN_STAGES.map(function(st){
    var matched = st.ids.some(function(idKey){ return ids.some(function(id){ return id.indexOf(idKey) !== -1; }); });
    return { key:st.key, label:st.label, matched: matched };
  });
  var matchedCount = stages.filter(function(s){ return s.matched; }).length;
  return { stages: stages, matchedCount: matchedCount };
}

function guessScamType(indicators){
  var ids = indicators.map(function(i){ return i.id; });
  var has = function(prefix){ return ids.some(function(id){ return id.indexOf(prefix)===0 || id.indexOf(prefix)!==-1; }); };
  var totalWeight = indicators.reduce(function(a,i){ return a+i.weight; }, 0);
  var pick = null;
  if (has('text_blackmail')) pick = { name:'Sextortion / Blackmail Scam', conf: Math.min(97, 55 + totalWeight/2) };
  else if (has('text_surveillance_pressure') && (has('text_authority') || has('text_threat'))) pick = { name:'"Digital Arrest" / Fake Police Scam', conf: Math.min(97, 55 + totalWeight/2) };
  else if (has('text_remote_access')) pick = { name:'Fake Tech-Support / Remote-Access Scam', conf: Math.min(96, 52 + totalWeight/2) };
  else if (has('text_guaranteed_returns')) pick = { name:'Investment / Trading Scam', conf: Math.min(95, 52 + totalWeight/2) };
  else if (has('text_recruitment')) pick = { name:'Pyramid Scheme / MLM Fraud', conf: Math.min(92, 48 + totalWeight/2) };
  else if (has('text_credential') && (has('text_threat') || has('text_authority'))) pick = { name:'Banking / KYC Phishing', conf: Math.min(97, 55 + totalWeight/2) };
  else if (has('url_brand')) pick = { name:'Phishing website impersonating a known brand', conf: Math.min(96, 55 + totalWeight/2) };
  else if (has('text_reward')) pick = { name:'Lottery / Prize Scam', conf: Math.min(94, 50 + totalWeight/2) };
  else if (has('upi_impersonation')) pick = { name:'UPI / Payment-ID Impersonation', conf: Math.min(93, 50 + totalWeight/2) };
  else if (has('text_financial') && has('text_urgency')) pick = { name:'Urgent Payment / Fee Fraud', conf: Math.min(90, 48 + totalWeight/2) };
  else if (has('text_secrecy')) pick = { name:'Social-Engineering / Confidence Scam', conf: Math.min(88, 45 + totalWeight/2) };
  else if (has('text_ml_language_model') && indicators.length) pick = { name:'Suspicious pattern (language-model flagged)', conf: Math.min(75, 35 + totalWeight/2) };
  else if (indicators.length) pick = { name:'Unclassified suspicious pattern', conf: Math.min(70, 35 + totalWeight/2) };
  else pick = { name:'No specific scam pattern detected', conf: 0 };
  return pick.name; // backward-compatible string return
}
function guessScamTypeDetailed(indicators){
  var name = guessScamType(indicators);
  var totalWeight = indicators.reduce(function(a,i){ return a+i.weight; }, 0);
  var conf = name === 'No specific scam pattern detected' ? 0 : U.clamp(Math.round(45 + totalWeight/1.6), 40, 97);
  return { name: name, confidence: conf };
}

function buildRecommendations(indicators){
  var ids = indicators.map(function(i){ return i.id; });
  var has = function(prefix){ return ids.some(function(id){ return id.indexOf(prefix)===0; }); };
  var list = [];
  if (has('text_credential')){
    list.push({ type:'dont', text:'Never share your OTP, PIN, CVV or net-banking password with anyone \u2014 banks and government agencies never ask for these.' });
  }
  if (has('text_remote_access')){
    list.push({ type:'dont', text:'Don\u2019t install any remote-access or screen-sharing app (AnyDesk, TeamViewer, Quick Support) for someone who contacted you unprompted \u2014 this gives them direct control of your device and banking apps.' });
  }
  if (has('text_blackmail')){
    list.push({ type:'do', text:'Don\u2019t pay. Stop responding, take screenshots as evidence, block the contact, and report it to cybercrime.gov.in or 1930 \u2014 paying rarely stops further demands.' });
  }
  if (has('text_surveillance_pressure')){
    list.push({ type:'do', text:'Real police and courts never conduct arrests or investigations over a video call. You can hang up \u2014 disconnecting is not illegal, however forceful the caller sounds.' });
  }
  if (has('text_guaranteed_returns')){
    list.push({ type:'dont', text:'Treat any "guaranteed", "zero-risk" or fixed-daily-return investment claim as a red flag \u2014 all genuine investments carry risk, and none can guarantee fixed profits.' });
  }
  if (has('text_recruitment')){
    list.push({ type:'do', text:'Be cautious of schemes that pay mainly for recruiting new members rather than for a real product \u2014 this is the structure of an unsustainable pyramid scheme.' });
  }
  if (has('text_financial') || has('qr_amount') || has('upi')){
    list.push({ type:'dont', text:'Don\u2019t make a payment or share card/UPI details through this channel.' });
  }
  if (has('url_')){
    list.push({ type:'dont', text:'Don\u2019t click the link. Type the organization\u2019s official address into your browser yourself instead.' });
  }
  if (has('text_threat') || has('text_authority')){
    list.push({ type:'do', text:'Contact the organization using the number on your card, bill, or their official app \u2014 not the one in this message.' });
  }
  if (has('text_reward')){
    list.push({ type:'do', text:'Remember: legitimate organizations don\u2019t ask you to pay a fee to release a prize you\u2019ve already \u201cwon.\u201d' });
  }
  if (has('text_secrecy')){
    list.push({ type:'do', text:'Be wary of anyone who asks you to keep a financial matter secret from your bank or family \u2014 that request is itself a red flag.' });
  }
  if (has('phone_') || has('upi_')){
    list.push({ type:'do', text:'Cross-check the number or payment ID independently before trusting it \u2014 this check used format rules only, not a live reputation database.' });
  }
  if (has('text_ml_language_model') && list.length <= 1){
    list.push({ type:'do', text:'The wording pattern resembles known scam messages even though few explicit red-flag phrases were found \u2014 verify independently before acting on it.' });
  }
  if (!list.length){
    list.push({ type:'do', text:'No strong scam indicators were found. No automated tool is perfect \u2014 if something still feels off, verify independently before acting.' });
  }
  list.push({ type:'do', text:'If you\u2019ve already shared details or paid, contact your bank\u2019s helpline immediately and file a report at cybercrime.gov.in (India) or your local cyber-crime authority.' });
  var seen = {};
  return list.filter(function(r){ if(seen[r.text]) return false; seen[r.text]=1; return true; });
}

window.TC.Analyze = {
  text: analyzeText, url: analyzeUrl, upi: analyzeUpi, phone: analyzePhone, qr: analyzeQrPayload,
  risk: riskFromIndicators, scamType: guessScamType, scamTypeDetailed: guessScamTypeDetailed,
  recommendations: buildRecommendations, dna: computeScamDna, VERDICT_META: VERDICT_META,
  EVIDENCE_QUALITY_META: EVIDENCE_QUALITY_META, attackChain: buildAttackChain,
  COUNTRIES: COUNTRIES, findCountry: findCountry
};
})();
</script>

<script>
/* ---------------------------------------------------------------------- */
/* Storage layer — window.storage (Claude artifact) > localStorage        */
/* (standalone downloaded file) > in-memory (last resort)                 */
/* ---------------------------------------------------------------------- */
(function(){
"use strict";
var memoryFallback = {};
var hasWindowStorage = !!(window.storage && typeof window.storage.set === 'function');
var hasLocalStorage = (function(){
  try { var k='__tc_probe__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();
var backend = hasWindowStorage ? 'window.storage' : (hasLocalStorage ? 'localStorage' : 'memory');
var LS_PREFIX = 'trustchain::';

async function safeGet(key){
  if (backend === 'window.storage'){
    try { var r = await window.storage.get(key, false); return r ? r.value : null; } catch(e){ return null; }
  }
  if (backend === 'localStorage'){ return localStorage.getItem(LS_PREFIX+key); }
  return memoryFallback[key] || null;
}
async function safeSet(key, value){
  if (backend === 'window.storage'){
    try { await window.storage.set(key, value, false); return true; } catch(e){ return false; }
  }
  if (backend === 'localStorage'){ try { localStorage.setItem(LS_PREFIX+key, value); return true; } catch(e){ return false; } }
  memoryFallback[key] = value; return true;
}
async function safeDelete(key){
  if (backend === 'window.storage'){
    try { await window.storage.delete(key, false); return true; } catch(e){ return false; }
  }
  if (backend === 'localStorage'){ localStorage.removeItem(LS_PREFIX+key); return true; }
  delete memoryFallback[key]; return true;
}

async function getIndex(){
  var raw = await safeGet('cases:index');
  if (!raw) return [];
  try { return JSON.parse(raw); } catch(e){ return []; }
}
async function setIndex(list){ return safeSet('cases:index', JSON.stringify(list)); }

function indexEntry(c){
  var entities = (window.TC.CaseModel && window.TC.CaseModel.entityValues) ? window.TC.CaseModel.entityValues(c.evidenceItems) : [];
  return { id:c.id, title:c.title, level:c.level, tier:c.tier, score:c.score, confidence:c.confidence,
    scamType:c.scamType, status:c.status||'Open', itemCount:c.evidenceItems.length, updatedAt:c.updatedAt, createdAt:c.createdAt,
    entities: entities };
}
/* Bug fix: saveCase previously ignored the return value of safeSet and
   unconditionally returned true, so a failed write (quota exceeded, storage
   disabled, private-browsing restrictions, etc.) was silently reported to
   the UI as "Case saved." This function now propagates real success/failure,
   and verifies the write by reading it back, so the caller can tell the
   person the truth. */
async function saveCase(caseObj){
  var wroteRecord = await safeSet('case:'+caseObj.id, JSON.stringify(caseObj));
  if (!wroteRecord){
    return { ok:false, reason:'write-failed', backend: backend };
  }
  var idx = await getIndex();
  idx = idx.filter(function(c){ return c.id !== caseObj.id; });
  idx.unshift(indexEntry(caseObj));
  if (idx.length > 500) idx = idx.slice(0,500);
  var wroteIndex = await setIndex(idx);
  if (!wroteIndex){
    return { ok:false, reason:'index-write-failed', backend: backend };
  }
  // Verify-on-write: read the record back rather than trusting the set()
  // call's return value alone (some storage backends resolve "success" even
  // when a quota silently truncates the write).
  var verify = await safeGet('case:'+caseObj.id);
  if (!verify){
    return { ok:false, reason:'verify-failed', backend: backend };
  }
  return { ok:true, backend: backend };
}
async function loadCase(id){
  var raw = await safeGet('case:'+id);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch(e){ return null; }
}
async function deleteCase(id){
  var deleted = await safeDelete('case:'+id);
  var idx = await getIndex();
  idx = idx.filter(function(c){ return c.id !== id; });
  var wroteIndex = await setIndex(idx);
  return { ok: !!(deleted && wroteIndex) };
}
async function wipeAllData(){
  var idx = await getIndex();
  var ok = true;
  for (var i=0;i<idx.length;i++){
    var r = await safeDelete('case:'+idx[i].id);
    if (!r) ok = false;
  }
  var cleared = await setIndex([]);
  return { ok: ok && cleared };
}
async function storageSelfTest(){
  var key = '__tc_write_test__';
  var val = String(Date.now());
  var wrote = await safeSet(key, val);
  var read = wrote ? await safeGet(key) : null;
  await safeDelete(key);
  return { ok: wrote && read === val, backend: backend, persistent: backend !== 'memory' };
}

window.TC = window.TC || {};
window.TC.Store = { getIndex:getIndex, saveCase:saveCase, loadCase:loadCase, deleteCase:deleteCase,
  wipeAllData:wipeAllData, storageSelfTest:storageSelfTest, backend:backend };

/* ---------------------------------------------------------------------- */
/* Feedback loop (point 29 of the product brief): purely local, per-device */
/* record of whether the person found a given evidence item's verdict     */
/* useful. Never transmitted, never used to auto-train anything \u2014 that  */
/* would require explicit consent and a real backend, neither of which    */
/* exist here. It exists so a person (or a future investigator dashboard) */
/* can see their own track record with the tool.                          */
/* ---------------------------------------------------------------------- */
var feedbackMemory = {};
function feedbackKey(){ return LS_PREFIX + 'feedback'; }
function feedbackLoadSync(){
  if (hasLocalStorage){
    try { return JSON.parse(localStorage.getItem(feedbackKey())||'{}'); } catch(e){ return {}; }
  }
  return feedbackMemory;
}
function feedbackGet(evidenceId){ return feedbackLoadSync()[evidenceId] || null; }
function feedbackSet(evidenceId, value){
  var all = feedbackLoadSync();
  all[evidenceId] = value;
  if (hasLocalStorage){
    try { localStorage.setItem(feedbackKey(), JSON.stringify(all)); return true; } catch(e){ return false; }
  }
  feedbackMemory = all; return true;
}
window.TC.Feedback = { get: feedbackGet, set: feedbackSet };
})();
</script>

<script>
/* ---------------------------------------------------------------------- */
/* File processing helpers (OCR / QR decode / PDF text extraction)        */
/* ---------------------------------------------------------------------- */
(function(){
"use strict";
function humanSize(bytes){
  if (bytes < 1024) return bytes + ' B';
  var kb = bytes/1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB';
  return (kb/1024).toFixed(1) + ' MB';
}

/* -------- upload limits (kept centralized so the UI, the validator, and -------- */
/* -------- the processing functions below all agree on the same numbers) -------- */
var LIMITS = {
  image: { maxBytes: 12*1024*1024, maxDimension: 6000, label: 'Images' },       // 12MB, 6000px on a side
  pdf:   { maxBytes: 25*1024*1024, maxPages: 15, label: 'PDF documents' },       // 25MB, 15 pages analyzed
  text:  { maxChars: 20000, label: 'Text' }
};
window.TC = window.TC || {};
window.TC.FileLimits = LIMITS;

/* Validates a File before any processing starts. Returns {ok:true} or
   {ok:false, message:'...'} with a message written for a non-technical
   user (per spec: "File is too large.", "Unsupported file type.", etc.)
   Checked BEFORE decode/OCR/parse begins so a huge or bogus file never
   reaches the expensive path (and can't freeze the tab). */
function validateFile(file, kind){
  if (!file) return { ok:false, message:'No file was selected.' };
  if (kind === 'pdf'){
    var isPdfType = file.type === 'application/pdf' || /\.pdf$/i.test(file.name||'');
    if (!isPdfType) return { ok:false, message:'Unsupported file type. Please upload a PDF document.' };
    if (file.size > LIMITS.pdf.maxBytes) return { ok:false, message:'File is too large. PDFs are limited to ' + humanSize(LIMITS.pdf.maxBytes) + '.' };
    if (file.size === 0) return { ok:false, message:'File appears empty or corrupted.' };
    return { ok:true };
  }
  // image (screenshot OCR or QR)
  var isImageType = file.type.indexOf('image/') === 0 || /\.(png|jpe?g|webp|gif|bmp)$/i.test(file.name||'');
  if (!isImageType) return { ok:false, message:'Unsupported file type. Please upload an image (PNG, JPG, WEBP).' };
  if (file.size > LIMITS.image.maxBytes) return { ok:false, message:'File is too large. Images are limited to ' + humanSize(LIMITS.image.maxBytes) + '.' };
  if (file.size === 0) return { ok:false, message:'File appears empty or corrupted.' };
  return { ok:true };
}

/* Loads an image file into an HTMLImageElement and checks its pixel
   dimensions are sane before anything touches a canvas — a maliciously
   or accidentally huge image (e.g. a 30000x30000px PNG) can exhaust
   browser memory via getImageData. Downscales oversized-but-plausible
   images rather than hard-failing, since phone screenshots at very high
   DPI legitimately exceed typical bounds. */
function loadImageChecked(file){
  return new Promise(function(resolve, reject){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h){ URL.revokeObjectURL(url); reject(new Error('File appears corrupted — no image data could be read.')); return; }
      resolve({ img:img, url:url, width:w, height:h });
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('File appears corrupted — could not be decoded as an image.')); };
    img.src = url;
  });
}
/* Draws (and downscales if needed) an image onto a canvas capped at
   LIMITS.image.maxDimension on the longer side, returning ImageData.
   Always revokes the temporary object URL, success or failure, so
   repeated uploads in one session don't leak blob URLs. */
function imageToCanvasData(file){
  return loadImageChecked(file).then(function(loaded){
    try {
      var w = loaded.width, h = loaded.height;
      var scale = Math.min(1, LIMITS.image.maxDimension / Math.max(w, h));
      var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(loaded.img, 0, 0, cw, ch);
      var imageData = ctx.getImageData(0, 0, cw, ch);
      return { imageData:imageData, width:cw, height:ch, downscaled: scale<1, originalWidth:w, originalHeight:h };
    } finally {
      URL.revokeObjectURL(loaded.url);
    }
  });
}

function decodeQrFromFile(file){
  var v = validateFile(file, 'image');
  if (!v.ok) return Promise.reject(new Error(v.message));
  return imageToCanvasData(file).then(function(c){
    var code = window.jsQR ? window.jsQR(c.imageData.data, c.width, c.height) : null;
    return code ? code.data : null;
  });
}
async function ocrImageFile(file, onProgress){
  var v = validateFile(file, 'image');
  if (!v.ok) throw new Error(v.message);
  if (!window.Tesseract) throw new Error('OCR engine did not load (needs an internet connection in your browser).');
  var result;
  try {
    result = await window.Tesseract.recognize(file, 'eng', {
      logger: function(m){
        if (onProgress && m.status === 'recognizing text'){ onProgress(Math.round((m.progress||0)*100)); }
        else if (onProgress && m.status){ onProgress(null, m.status); }
      }
    });
  } catch(e){
    throw new Error('OCR could not be completed on this image (' + (e && e.message ? e.message : 'engine error') + '). Analysis is incomplete — this does NOT mean no scam indicators are present.');
  }
  var data = result && result.data;
  var text = (data && data.text) ? data.text.trim() : '';
  var confidence = (data && typeof data.confidence === 'number') ? Math.round(data.confidence) : null;
  return { text: text, confidence: confidence };
}
async function extractPdfText(file, onProgress){
  var v = validateFile(file, 'pdf');
  if (!v.ok) throw new Error(v.message);
  if (!window.pdfjsLib) throw new Error('PDF engine did not load (needs an internet connection in your browser).');
  var buf;
  try { buf = await file.arrayBuffer(); }
  catch(e){ throw new Error('File appears corrupted — could not be read.'); }
  var pdf;
  try {
    var loadingTask = window.pdfjsLib.getDocument({ data: buf });
    pdf = await loadingTask.promise;
  } catch(e){
    throw new Error('PDF appears corrupted or password-protected and could not be opened.');
  }
  var maxPages = Math.min(pdf.numPages, LIMITS.pdf.maxPages);
  var text = '';
  var pagesWithNoText = 0;
  for (var i=1; i<=maxPages; i++){
    if (onProgress) onProgress(Math.round((i/maxPages)*100));
    try {
      var page = await pdf.getPage(i);
      var content = await page.getTextContent();
      var pageText = content.items.map(function(it){ return it.str; }).join(' ');
      if (!pageText.trim()) pagesWithNoText++;
      text += pageText + '\n';
    } catch(e){
      pagesWithNoText++; // this page couldn't be read; do not silently pretend it was empty/clean
    }
  }
  var skipped = pdf.numPages - maxPages;
  return {
    text: text.trim(),
    numPages: pdf.numPages,
    scanned: maxPages,
    skippedPages: skipped,
    pagesWithNoText: pagesWithNoText,
    // An image-only / scanned PDF has selectable text extraction return
    // almost nothing even though the document clearly has content — this
    // is the signal the UI uses to say "Partial analysis" / "OCR needed"
    // instead of silently treating a blank extraction as "nothing found".
    likelyImageOnly: (text.trim().length < 20 && maxPages > 0)
  };
}
window.TC.Files = { humanSize:humanSize, decodeQrFromFile:decodeQrFromFile, ocrImageFile:ocrImageFile, extractPdfText:extractPdfText, validateFile:validateFile, imageToCanvasData:imageToCanvasData };
})();

<script>
/* ---------------------------------------------------------------------- */
/* Pipelines — turn raw input into a finished EVIDENCE ITEM.               */
/* A case can hold several evidence items gathered over time.             */
/* ---------------------------------------------------------------------- */
(function(){
"use strict";
var U = window.TC, A = window.TC.Analyze, F = window.TC.Files;

var TYPE_META = {
  message:   { name:'Message',      icon:'\u{1F4AC}', desc:'WhatsApp, SMS, email or social-media message text' },
  url:       { name:'URL / Link',   icon:'\u{1F517}', desc:'A suspicious website or link' },
  screenshot:{ name:'Screenshot',   icon:'\u{1F4F8}', desc:'Image of a chat, SMS, bank notice or receipt' },
  qr:        { name:'QR code',      icon:'\u{1F4F1}', desc:'A payment or link QR code image' },
  document:  { name:'Document',     icon:'\u{1F4C4}', desc:'A PDF invoice, notice or letter' },
  phone:     { name:'Phone number', icon:'\u{1F4DE}', desc:'A caller or SMS sender number' },
  upi:       { name:'UPI ID',       icon:'\u{1F4B3}', desc:'A payment address such as name@bank' },
  voice:     { name:'Voice call',   icon:'\u{1F3A4}', desc:'A phone-call transcript' }
};
var TYPE_ORDER = ['message','url','screenshot','qr','document','phone','upi','voice'];

function finalizeEvidence(opts){
  var evidenceSize = opts.evidenceSize != null ? opts.evidenceSize : (opts.sourceSummary || '').length;
  var risk = A.risk(opts.indicators, evidenceSize);
  // A technical failure (OCR produced nothing / low confidence, a PDF
  // couldn't be parsed, etc.) must NEVER be presented as "no risk found" —
  // that reads as a safety verdict when really nothing was checked. If the
  // pipeline flagged the extraction as incomplete and no indicators fired
  // (so the risk engine would otherwise report "nosignal"/"low", which
  // renders as reassuring green), force an explicit UNKNOWN result instead.
  if (opts.analysisIncomplete && !opts.indicators.length && risk.tier !== 'veryhigh' && risk.tier !== 'high'){
    risk = { score: 0, level: 'unknown', tier: 'unknown', confidence: 5, evidenceQuality: 'insufficient' };
  }
  var scamTypeInfo = A.scamTypeDetailed(opts.indicators);
  return {
    id: 'EV-' + U.uid(8).toUpperCase(),
    type: opts.type, typeName: TYPE_META[opts.type].name,
    title: opts.title, sourceSummary: opts.sourceSummary, submittedAt: new Date().toISOString(),
    extracted: opts.extracted, indicators: opts.indicators, score: risk.score, level: risk.level,
    tier: risk.tier, confidence: risk.confidence, evidenceQuality: risk.evidenceQuality,
    scamType: scamTypeInfo.name, scamConfidence: scamTypeInfo.confidence, dna: A.dna(opts.indicators),
    attackChain: A.attackChain(opts.indicators),
    mlProbability: opts.mlProbability != null ? opts.mlProbability : null,
    recommendations: A.recommendations(opts.indicators),
    hash: opts.hash || null, notes: opts.notes || null,
    analysisIncomplete: !!opts.analysisIncomplete,
    rawText: opts.rawText != null ? opts.rawText : null, // unredacted source text, kept ONLY for "Full Evidence Export"; never rendered in the normal UI
    engineVersion: window.TC.ENGINE_VERSION
  };
}
function urlIndicatorsFromText(text, tagCategory){
  var found = U.extractUrls(text);
  var indicators = [];
  found.forEach(function(u){
    var r = A.url(u);
    r.indicators.forEach(function(ind){ indicators.push(Object.assign({}, ind, { id: tagCategory+'_'+ind.id, detail: u+' \u2014 '+ind.detail })); });
  });
