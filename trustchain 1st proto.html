}
function truncate(s, n){ s = s||''; return s.length>n ? s.slice(0,n)+'\u2026' : s; }

async function pipelineMessage(text){
  text = (text||'').trim();
  var textRes = A.text(text);
  var urlBits = urlIndicatorsFromText(text, 'msg_url');
  var hash = await U.sha256Hex(text);
  return finalizeEvidence({
    type:'message', title:'Message verification', sourceSummary: U.maskSensitive(truncate(text, 160)), rawText: text,
    extracted: { 'Message length': text.length + ' characters', 'Links found in message': urlBits.urls.length ? urlBits.urls.join(', ') : 'None' },
    indicators: textRes.indicators.concat(urlBits.indicators), evidenceSize: text.length,
    mlProbability: textRes.mlProbability,
    hash: { algo:'SHA-256', value:hash, of:'pasted message text' }
  });
}
async function pipelineUrl(raw){
  raw = (raw||'').trim();
  var r = A.url(raw);
  var hash = await U.sha256Hex(raw);
  return finalizeEvidence({
    type:'url', title:'Link verification', sourceSummary: raw,
    extracted: { 'URL submitted': raw, 'Hostname': (r.info && r.info.hostname) || '\u2014', 'Protocol': (r.info && r.info.protocol) ? r.info.protocol.toUpperCase() : '\u2014' },
    indicators: r.indicators, evidenceSize: 120, hash: { algo:'SHA-256', value:hash, of:'submitted URL string' }
  });
}
async function pipelineScreenshot(file, onProgress){
  var v = F.validateFile(file, 'image');
  if (!v.ok) throw new Error(v.message);
  var buf = await file.arrayBuffer();
  var hash = await U.sha256Hex(buf);
  var ocr = await F.ocrImageFile(file, onProgress);
  var text = ocr.text;
  var lowConfidence = (ocr.confidence != null && ocr.confidence < 60);
  var textRes = A.text(text);
  var urlBits = urlIndicatorsFromText(text, 'shot_url');
  var ocrNote;
  if (!text) {
    ocrNote = 'OCR could not read any text from this image. This means analysis is INCOMPLETE, not that no scam indicators are present \u2014 try a clearer or higher-resolution screenshot.';
  } else if (lowConfidence) {
    ocrNote = 'Text extraction confidence is low (' + ocr.confidence + '%). Results may be incomplete or contain errors \u2014 treat this analysis as partial, not conclusive.';
  } else {
    ocrNote = null;
  }
  return finalizeEvidence({
    type:'screenshot', title:'Screenshot verification', sourceSummary: U.maskSensitive(truncate(text, 160)) || file.name, rawText: text,
    extracted: {
      'File name': file.name, 'File size': F.humanSize(file.size),
      'OCR confidence': ocr.confidence != null ? (ocr.confidence + '%' + (lowConfidence ? ' (low \u2014 results may be incomplete)' : '')) : 'Not reported by OCR engine',
      'Text extracted (OCR)': text ? U.maskSensitive(truncate(text, 700)) : '(no readable text found)',
      'Links found in text': urlBits.urls.length ? urlBits.urls.join(', ') : 'None'
    },
    indicators: textRes.indicators.concat(urlBits.indicators), evidenceSize: text.length,
    mlProbability: textRes.mlProbability,
    hash: { algo:'SHA-256', value:hash, of:'uploaded image file' },
    analysisIncomplete: !text || lowConfidence,
    notes: ocrNote
  });
}
async function pipelineQr(file){
  var buf = await file.arrayBuffer();
  var hash = await U.sha256Hex(buf);
  var v = F.validateFile(file, 'image');
  if (!v.ok) throw new Error(v.message);
  var payload = await F.decodeQrFromFile(file);
  if (!payload){
    return finalizeEvidence({
      type:'qr', title:'QR code verification', sourceSummary: file.name,
      extracted: { 'File name': file.name, 'File size': F.humanSize(file.size), 'Decoded content': '(no QR code detected in this image)' },
      indicators: [], evidenceSize: 0, analysisIncomplete: true,
      hash: { algo:'SHA-256', value:hash, of:'uploaded image file' },
      notes: 'No QR code could be decoded from this image. This means the image could not be read \u2014 it does NOT mean the QR code (if one exists) is safe. Try a sharper, better-lit, closer photo of just the code.'
    });
  }
  var qrRes = A.qr(payload);
  var extracted = { 'File name': file.name, 'Decoded content': payload, 'Payload type': qrRes.sub.kind.toUpperCase() };
  if (qrRes.sub.kind === 'upi' && qrRes.sub.detail){
    extracted['Payee address'] = qrRes.sub.detail.payee || '\u2014';
    extracted['Payee name'] = qrRes.sub.detail.payeeName || '\u2014';
    extracted['Requested amount'] = qrRes.sub.detail.amount ? ('\u20b9' + qrRes.sub.detail.amount) : 'Not specified';
  }
  return finalizeEvidence({
    type:'qr', title:'QR code verification', sourceSummary: truncate(payload, 160), extracted: extracted,
    indicators: qrRes.indicators, evidenceSize: Math.max(payload.length, 60), hash: { algo:'SHA-256', value:hash, of:'uploaded image file' }
  });
}
async function pipelineDocument(file, onProgress){
  var v = F.validateFile(file, 'pdf');
  if (!v.ok) throw new Error(v.message);
  var buf = await file.arrayBuffer();
  var hash = await U.sha256Hex(buf);
  var pdfRes = await F.extractPdfText(file, onProgress);
  var textRes = A.text(pdfRes.text);
  var urlBits = urlIndicatorsFromText(pdfRes.text, 'doc_url');
  var noteParts = [];
  var incomplete = false;
  if (pdfRes.skippedPages > 0){
    noteParts.push('Partial analysis: only the first ' + pdfRes.scanned + ' of ' + pdfRes.numPages + ' pages were analyzed (' + pdfRes.skippedPages + ' page(s) skipped due to the page limit).');
    incomplete = true;
  }
  if (pdfRes.likelyImageOnly){
    noteParts.push('No selectable text was found \u2014 this is likely a scanned/image-only PDF. OCR-on-PDF is not implemented in this build, so this document\u2019s content has NOT been analyzed. This does not mean the document is safe.');
    incomplete = true;
  } else if (pdfRes.pagesWithNoText > 0){
    noteParts.push(pdfRes.pagesWithNoText + ' scanned page(s) returned no extractable text and were not analyzed.');
    incomplete = true;
  }
  return finalizeEvidence({
    type:'document', title:'Document verification', sourceSummary: U.maskSensitive(truncate(pdfRes.text, 160)) || file.name, rawText: pdfRes.text,
    extracted: {
      'File name': file.name, 'File size': F.humanSize(file.size), 'Pages scanned': pdfRes.scanned + ' of ' + pdfRes.numPages,
      'Analysis coverage': pdfRes.skippedPages > 0 ? ('Partial \u2014 ' + pdfRes.skippedPages + ' page(s) not analyzed') : 'Complete (all pages within limit)',
      'Text extracted (preview)': pdfRes.text ? U.maskSensitive(truncate(pdfRes.text, 700)) : '(no extractable text found — this may be a scanned image PDF)',
      'Links found in text': urlBits.urls.length ? urlBits.urls.join(', ') : 'None'
    },
    indicators: textRes.indicators.concat(urlBits.indicators), evidenceSize: pdfRes.text.length,
    mlProbability: textRes.mlProbability,
    hash: { algo:'SHA-256', value:hash, of:'uploaded PDF file' },
    analysisIncomplete: incomplete || !pdfRes.text,
    notes: noteParts.length ? noteParts.join(' ') : null
  });
}
async function pipelinePhone(raw, countryCode){
  raw = (raw||'').trim();
  var r = A.phone(raw, countryCode);
  var country = A.findCountry(countryCode);
  var hash = await U.sha256Hex(country.code+':'+raw);
  return finalizeEvidence({
    type:'phone', title:'Phone number check', sourceSummary: (country.dial ? '+'+country.dial+' ' : '')+raw,
    extracted: { 'Number checked': raw, 'Country selected': country.flag+' '+country.name+(country.dial?' (+'+country.dial+')':''),
      'Digits detected': r.info.digits, 'Standard format for selected country': r.info.looksStandardFormat ? 'Yes' : 'No' },
    indicators: r.indicators, evidenceSize: 80, hash: { algo:'SHA-256', value:hash, of:'submitted phone number + country' },
    notes: 'No live caller-reputation database is connected \u2014 this check uses format and pattern rules only, based on the country you selected.'
  });
}
async function pipelineUpi(raw){
  raw = (raw||'').trim();
  var r = A.upi(raw);
  var hash = await U.sha256Hex(raw);
  var statusLabel = { UNVERIFIED:'UNVERIFIED \u2014 no live payment-reputation database connected', SUSPICIOUS:'SUSPICIOUS \u2014 format or naming red flags found' }[r.info.status] || r.info.status;
  return finalizeEvidence({
    type:'upi', title:'UPI ID check', sourceSummary: raw,
    extracted: { 'UPI ID checked': raw, 'Format valid': r.info.valid ? 'Yes' : 'No', 'Payment handle': r.info.handle ? ('@' + r.info.handle) : '\u2014',
      'Verification status': statusLabel },
    indicators: r.indicators, evidenceSize: 80, hash: { algo:'SHA-256', value:hash, of:'submitted UPI ID' },
    notes: 'No live payment-reputation database is connected \u2014 this check uses format and naming-pattern rules only. TrustChain never labels a UPI ID "verified" without a connected provider.'
  });
}
async function pipelineVoice(transcript){
  transcript = (transcript||'').trim();
  var textRes = A.text(transcript);
  var urlBits = urlIndicatorsFromText(transcript, 'voice_url');
  var hash = await U.sha256Hex(transcript);
  return finalizeEvidence({
    type:'voice', title:'Voice call verification', sourceSummary: U.maskSensitive(truncate(transcript, 160)), rawText: transcript,
    extracted: { 'Transcript length': transcript.length + ' characters', 'Links mentioned': urlBits.urls.length ? urlBits.urls.join(', ') : 'None' },
    indicators: textRes.indicators.concat(urlBits.indicators), evidenceSize: transcript.length,
    mlProbability: textRes.mlProbability,
    hash: { algo:'SHA-256', value:hash, of:'pasted call transcript' },
    notes: 'This demo analyzes a pasted transcript. Live in-browser speech-to-text from an uploaded recording is not performed.'
  });
}

window.TC.Pipelines = {
  message: pipelineMessage, url: pipelineUrl, screenshot: pipelineScreenshot, qr: pipelineQr,
  document: pipelineDocument, phone: pipelinePhone, upi: pipelineUpi, voice: pipelineVoice
};
window.TC.TYPE_META = TYPE_META;
window.TC.TYPE_ORDER = TYPE_ORDER;

/* ---- case helpers: a case aggregates 1+ evidence items ---- */
var EQ_RANK = { insufficient:0, weak:1, moderate:2, strong:3 };
function computeAggregate(items){
  if (!items.length) return { score:0, level:'low', tier:'unknown', confidence:0, scamType:'No evidence yet', evidenceQuality:'insufficient' };
  var worst = items.reduce(function(a,b){ return b.score > a.score ? b : a; }, items[0]);
  var avgConf = Math.round(items.reduce(function(a,i){ return a + (i.confidence||0); },0) / items.length);
  // Evidence Quality for a case is the STRONGEST quality seen across its
  // evidence items (the best-supported item), not an average \u2014 a case
  // with one strong item and one weak item still has strong evidence for
  // at least part of what happened.
  var bestQuality = items.reduce(function(a,i){
    var q = i.evidenceQuality || 'insufficient';
    return (EQ_RANK[q]||0) > (EQ_RANK[a]||0) ? q : a;
  }, 'insufficient');
  return { score: worst.score, level: worst.level, tier: worst.tier, confidence: avgConf, scamType: worst.scamType, evidenceQuality: bestQuality };
}
function aggregateDna(items){
  if (!items.length) return [];
  var keys = items[0].dna ? items[0].dna.map(function(d){ return d.key; }) : [];
  return keys.map(function(key, idx){
    var label = items[0].dna[idx].label;
    var maxPct = 0;
    items.forEach(function(it){
      var d = (it.dna||[]).find(function(x){ return x.key===key; });
      if (d && d.pct > maxPct) maxPct = d.pct;
    });
    return { key:key, label:label, pct:maxPct };
  });
}
function buildCase(firstItem){
  var now = new Date().toISOString();
  var agg = computeAggregate([firstItem]);
  return {
    id: U.makeCaseId(), title: agg.scamType !== 'No specific scam pattern detected' ? agg.scamType : (TYPE_META[firstItem.type].name + ' review'),
    createdAt: now, updatedAt: now, evidenceItems: [firstItem], status: 'Open',
    score: agg.score, level: agg.level, tier: agg.tier, confidence: agg.confidence, evidenceQuality: agg.evidenceQuality,
    scamType: agg.scamType, saved:false
  };
}
function addEvidenceToCase(caseObj, item){
  caseObj.evidenceItems.push(item);
  var agg = computeAggregate(caseObj.evidenceItems);
  caseObj.score = agg.score; caseObj.level = agg.level; caseObj.tier = agg.tier; caseObj.confidence = agg.confidence; caseObj.scamType = agg.scamType; caseObj.evidenceQuality = agg.evidenceQuality;
  caseObj.updatedAt = new Date().toISOString();
  if (!caseObj.status) caseObj.status = 'Open';
  return caseObj;
}
var ENTITY_RE = /((?:https?:\/\/|www\.)[^\s,;]+|[6-9]\d{9}|[\w.\-]{2,}@[a-zA-Z][\w]{1,})/g;
function correlateEntities(items){
  var seen = {};
  items.forEach(function(item){
    var haystack = Object.keys(item.extracted||{}).map(function(k){ return item.extracted[k]; }).join(' \u2022 ');
    var found = haystack.match(ENTITY_RE) || [];
    found.forEach(function(f){
      f = f.replace(/[.,;:!?)]+$/,'');
      if (!seen[f]) seen[f] = { value:f, count:0, items:[] };
      if (seen[f].items.indexOf(item.id) === -1){ seen[f].count++; seen[f].items.push(item.id); }
    });
  });
  return Object.keys(seen).map(function(k){ return seen[k]; }).filter(function(e){ return e.count > 1; }).sort(function(a,b){ return b.count-a.count; });
}
/* Every distinct link, phone number or payment ID mentioned anywhere in a
   case's evidence — used to spot connections ACROSS separately saved
   cases, not just repeats within one case (see correlateEntities above). */
function entityValues(items){
  var seen = {};
  (items||[]).forEach(function(item){
    var haystack = Object.keys(item.extracted||{}).map(function(k){ return item.extracted[k]; }).join(' \u2022 ');
    var found = haystack.match(ENTITY_RE) || [];
    found.forEach(function(f){ seen[f.replace(/[.,;:!?)]+$/,'')] = true; });
  });
  return Object.keys(seen);
}
/* Cross-case correlation: does this evidence share a link, phone number or
   payment ID with any OTHER saved case? Powers the "possibly related case"
   prompt so evidence from the same scam doesn't end up scattered across
   several disconnected cases. */
function findRelatedCases(items, casesIndex, excludeCaseId){
  var mine = entityValues(items);
  if (!mine.length) return [];
  var out = [];
  (casesIndex||[]).forEach(function(entry){
    if (entry.id === excludeCaseId) return;
    var theirs = entry.entities || [];
    var overlap = mine.filter(function(v){ return theirs.indexOf(v) !== -1; });
    if (overlap.length) out.push({ caseEntry: entry, overlap: overlap });
  });
  return out.sort(function(a,b){ return b.overlap.length - a.overlap.length; });
}
window.TC.CaseModel = { buildCase: buildCase, addEvidenceToCase: addEvidenceToCase, computeAggregate: computeAggregate,
  aggregateDna: aggregateDna, correlateEntities: correlateEntities, entityValues: entityValues, findRelatedCases: findRelatedCases };
})();
</script>

<script>
/* ---------------------------------------------------------------------- */
/* Application shell — routing, rendering, events                        */
/* ---------------------------------------------------------------------- */
(function(){
"use strict";
var U = window.TC, esc = U.escapeHtml, TYPES = U.TYPE_META, TYPE_ORDER = U.TYPE_ORDER;
var Store = U.Store, Pipelines = U.Pipelines, CaseModel = U.CaseModel;

var state = {
  mode: 'standard',           // 'standard' | 'investigator'
  route: { name:'home', params:{} },
  current: null,              // case currently displayed (may be unsaved)
  activeTab: 'evidence',
  casesIndex: [],
  filterQuery: '', filterLevel: 'all',
  recentCases: [],
  pendingFile: null,
  addingEvidence: false
};

function $(sel, root){ return (root||document).querySelector(sel); }
function toast(msg){
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  t.setAttribute('role','status'); t.setAttribute('aria-live','polite');
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}
function stampLabel(level, tier){
  if (tier && U.Analyze.VERDICT_META[tier]) return U.Analyze.VERDICT_META[tier].label;
  return level==='high' ? 'High risk' : (level==='medium' ? 'Medium risk' : (level==='unknown' ? 'Unknown' : 'Low risk'));
}
function riskGlyph(level, tier){
  if (tier && U.Analyze.VERDICT_META[tier]) return U.Analyze.VERDICT_META[tier].glyph;
  return level==='high' ? '!' : (level==='unknown' ? '?' : (level==='medium' ? '?' : '\u2713'));
}

/* ---------------- routing ---------------- */
async function navigate(name, params){
  params = params || {};
  if (name === 'cases'){ state.casesIndex = await Store.getIndex(); }
  if (name === 'dashboard'){ state.casesIndex = await Store.getIndex(); }
  if (name === 'case'){
    var c = await Store.loadCase(params.id);
    if (!c){ toast('That case could not be found.'); name = 'cases'; state.casesIndex = await Store.getIndex(); }
    else { state.current = c; state.activeTab = 'evidence'; }
  }
  if (name === 'home'){
    state.casesIndex = await Store.getIndex();
    state.recentCases = state.casesIndex.slice(0,4);
  }
  if (name === 'result'){ state.casesIndex = await Store.getIndex(); }
  if (name === 'verify'){ state.pendingFile = null; state.addingEvidence = !!params.addTo; }
  if (name === 'emergency'){ state.emergencySelected = state.emergencySelected || {}; }
  state.route = { name:name, params:params };
  render();
  window.scrollTo(0,0);
}

/* ---------------- shared sub-renderers ---------------- */
function evidenceQualityLabel(eq){
  var meta = U.Analyze.EVIDENCE_QUALITY_META[eq];
  return meta ? meta.label : 'Unknown';
}
function riskBanner(level, score, scamType, tier, confidence, evidenceQuality){
  tier = tier || level;
  var meta = U.Analyze.VERDICT_META[tier];
  var emoji = meta ? (meta.emoji+' ') : '';
  var confBlock = (confidence != null) ? '<div class="rb-confidence">Confidence '+confidence+'% \u2014 how reliable this verdict is, based on how much evidence was available</div>' : '';
  var eqMeta = evidenceQuality ? U.Analyze.EVIDENCE_QUALITY_META[evidenceQuality] : null;
  var eqRow = eqMeta ? '<div class="eq-row">'+
      '<div class="eq-item"><div class="eq-label">Risk score</div><div class="eq-value">'+score+' / 100</div></div>'+
      '<div class="eq-item"><div class="eq-label">Confidence</div><div class="eq-value">'+(confidence!=null?confidence+'%':'\u2014')+'</div></div>'+
      '<div class="eq-item"><div class="eq-label">Evidence quality</div><div class="eq-value">'+esc(eqMeta.label)+'</div></div>'+
    '</div>' : '';
  var verificationLine = '<div class="verification-line"><span class="vl-dot"></span>Verification: NOT INDEPENDENTLY VERIFIED \u2014 this is an automated content check, not confirmation from the sender, bank, or any live reputation database.</div>';
  var insufficientBox = (tier === 'unknown') ? '<div class="insufficient-box">'+
      '<strong>Insufficient evidence to assess risk.</strong> Not enough content was submitted or could be extracted to run a meaningful check. This does not mean the item is safe \u2014 absence of evidence is not evidence of legitimacy.'+
      '<ul><li>Paste the full message, link, or document rather than a fragment</li><li>For screenshots, use a clear, high-resolution image</li><li>Independently verify the sender or source through an official channel before acting</li></ul>'+
    '</div>' : '';
  var noSignalNote = (tier === 'nosignal') ? '<p class="hint" style="margin-top:8px;">No indicators in TrustChain\u2019s current rule set were matched. This is not a certification of safety \u2014 no automated tool catches every scam pattern, especially new or highly targeted ones.</p>' : '';
  return '<div class="risk-banner risk-'+level+'">'+
    '<div class="risk-glyph risk-'+level+'">'+riskGlyph(level, tier)+'</div>'+
    '<div style="flex:1;"><div class="rb-label">'+emoji+stampLabel(level, tier)+' \u2014 '+score+' / 100</div>'+
    '<div class="rb-score">'+esc(scamType)+'</div>'+confBlock+eqRow+insufficientBox+noSignalNote+'</div></div>'+
    verificationLine;
}
function meterHtml(score, level){
  return '<div class="meter"><div class="fill risk-'+level+'" style="width:'+score+'%"></div></div>'+
    '<div class="meter-ticks"><span>0 low</span><span>25 suspicious</span><span>50 high</span><span>75 very high</span><span>100</span></div>';
}
function contribBarsHtml(indicators){
  if (!indicators.length) return '<p class="hint" style="margin-top:0;">No weighted indicators to chart.</p>';
  var maxW = Math.max.apply(null, indicators.map(function(i){ return i.weight; }));
  return indicators.map(function(i){
    var pct = Math.round((i.weight/Math.max(maxW,1))*100);
    return '<div class="contrib-row"><span class="cl" title="'+esc(i.label)+'">'+esc(i.label)+'</span>'+
      '<span class="contrib-bar"><span class="f" style="width:'+pct+'%"></span></span>'+
      '<span class="cn">+'+i.weight+'</span></div>';
  }).join('');
}
function dnaHtml(dna, scamType, scamConfidence){
  if (!dna || !dna.length) return '<p class="hint" style="margin-top:0;">Not enough signal to build a Scam DNA profile.</p>';
  var rows = dna.map(function(d){
    return '<div class="dna-row"><span class="dl">'+esc(d.label)+'</span>'+
      '<span class="dna-bar"><span class="f" style="width:'+d.pct+'%"></span></span>'+
      '<span class="dn">'+d.pct+'%</span></div>';
  }).join('');
  var familyHtml = (scamType && scamType !== 'No specific scam pattern detected')
    ? '<div class="dna-family"><span class="df-name">\u{1F9EC} Likely scam family: '+esc(scamType)+'</span><span class="df-conf">Confidence '+(scamConfidence||0)+'%</span></div>'
    : '<div class="dna-family"><span class="df-name">No specific scam family identified</span><span class="df-conf">\u2014</span></div>';
  return rows + familyHtml;
}
function flagListHtml(indicators, uidPrefix){
  if (!indicators.length) return '<ul class="flag-list safe"><li>No scam indicators matched by the current rule set.</li></ul>';
  var rows = indicators.map(function(i, idx){
    var whyId = 'why-'+uidPrefix+'-'+idx;
    return '<li>'+esc(i.label)+'<span class="flag-weight">+'+i.weight+'</span>'+
      (i.detail?'<span class="flag-detail">'+esc(i.detail)+'</span>':'')+
      '<button class="why-toggle" data-action="toggle-why" data-target="'+whyId+'" type="button">Why?</button>'+
      '<div class="why-box" id="'+whyId+'">'+esc(U.explainIndicator(i))+'</div>'+
    '</li>';
  }).join('');
  return '<ul class="flag-list">'+rows+'</ul>';
}
function mlPanelHtml(item){
  if (item.mlProbability == null) return '';
  var pct = Math.round(item.mlProbability*100);
  var tone = pct>=75 ? 'risk-high' : (pct>=45 ? 'risk-medium' : 'risk-low');
  return '<div class="panel"><h3 class="section-title">Language model assessment</h3>'+
    '<div class="dna-row"><span class="dl">Scam-like wording</span>'+
    '<span class="dna-bar"><span class="f" style="width:'+pct+'%"></span></span>'+
    '<span class="dn">'+pct+'%</span></div>'+
    '<p class="hint" style="margin-top:10px; margin-bottom:0;">A statistical language model trained on 900,000 example messages, English/Hindi/Hinglish (15 scam scenarios + 10 everyday message types, from the TrustChain-Synthetic-1.0 synthetic dataset) rates how closely this text\u2019s wording resembles scam messages it learned from. This score is only one input into the overall risk score above \u2014 it does not override the rule-based checks. Honest accuracy check: on an independent, hand-written test set NOT drawn from the training templates, this model reached 95% recall on scam-like messages but only 63% precision on ordinary messages (it over-flags everyday texts about OTPs, bills, and appointments). Treat it as a weak, bounded signal \u2014 never as a verdict on its own.</p>'+
  '</div>';
}
/* "Provider not configured" panel (points 7/9/10/61/77 of the brief): rather
   than fabricate WHOIS/domain-age/phone-reputation/payment-reputation data,
   TrustChain shows exactly which live intelligence sources a full deployment
   would use, and states plainly that none is connected in this build. This
   keeps the provider architecture visible and swappable (see ARCHITECTURE.md)
   without ever presenting invented data as real. */
var PROVIDER_SOURCES = {
  url: [
    { name:'Domain age / WHOIS / RDAP', source:'e.g. RDAP registry lookup' },
    { name:'DNS records / hosting / ASN', source:'e.g. passive DNS provider' },
    { name:'TLS certificate transparency', source:'e.g. crt.sh / CT log API' },
    { name:'URL & malware reputation', source:'e.g. Safe Browsing / VirusTotal-class API' }
  ],
  qr: [
    { name:'URL & malware reputation', source:'e.g. Safe Browsing / VirusTotal-class API' }
  ],
  phone: [
    { name:'Carrier / line-type lookup', source:'e.g. HLR lookup provider' },
    { name:'Community scam-report history', source:'e.g. crowdsourced caller-ID provider' }
  ],
  upi: [
    { name:'Payee identity verification', source:'e.g. bank / NPCI-linked verification' },
    { name:'Payment-ID scam-report history', source:'e.g. crowdsourced fraud database' }
  ]
};
function providerPanelHtml(item){
  var sources = PROVIDER_SOURCES[item.type];
  if (!sources) return '';
  var rows = sources.map(function(s){
    return '<div class="provider-row"><div><div class="pr-name">'+esc(s.name)+'</div><div class="pr-meta">'+esc(s.source)+'</div></div>'+
      '<span class="source-badge notconfigured">Not configured</span></div>';
  }).join('');
  return '<div class="panel"><h3 class="section-title">Live threat intelligence</h3>'+
    '<p class="hint" style="margin-top:0;">This result used offline, rule-based format and pattern checks only. TrustChain\u2019s provider architecture supports plugging in the live sources below, but none is connected in this deployment \u2014 so none of their data appears here.</p>'+
    rows+'</div>';
}
function evidenceItemPanel(item, opts){
  opts = opts || {};
  var evidenceRows = Object.keys(item.extracted).map(function(k){
    return '<div class="field-row"><span class="k">'+esc(k)+'</span><span class="v">'+esc(item.extracted[k])+'</span></div>';
  }).join('');
  var hashRow = item.hash ? '<div class="field-row"><span class="k">Evidence hash ('+esc(item.hash.algo)+')</span><span class="v">'+esc(item.hash.value)+'</span></div>' : '';
  var noteHtml = item.notes ? '<p class="note">'+esc(item.notes)+'</p>' : '';
  var recHtml = item.recommendations.map(function(r){ return '<li class="'+(r.type==='do'?'do':'dont')+'">'+esc(r.text)+'</li>'; }).join('');
  var versionRow = item.engineVersion ? '<div class="field-row"><span class="k">Engine / ruleset / model version</span><span class="v">'+esc(item.engineVersion.engine)+' \u00b7 '+esc(item.engineVersion.ruleset)+' \u00b7 '+esc(item.engineVersion.model)+'</span></div>' : '';

  return ''+
  '<div class="panel">'+
    '<div class="verdict-head" style="margin-bottom:10px;">'+
      '<div><h3 class="section-title" style="margin-bottom:4px;">'+esc(item.typeName)+' \u00b7 '+esc(U.fmtDate(item.submittedAt))+'</h3>'+
      '<h1 class="page-title" style="font-size:20px;">'+esc(item.scamType)+'</h1>'+
      '<p class="lede" style="font-size:13.5px;">'+esc(item.sourceSummary || 'No preview available.')+'</p></div>'+
    '</div>'+
    riskBanner(item.level, item.score, item.scamType, item.tier, item.confidence, item.evidenceQuality)+
    meterHtml(item.score, item.level)+
    noteHtml+
  '</div>'+
  '<div class="panel"><h3 class="section-title">Why this result?</h3>'+contribBarsHtml(item.indicators)+'</div>'+
  providerPanelHtml(item)+
  attackChainHtml(item.attackChain)+
  '<div class="panel"><h3 class="section-title">Scam DNA</h3>'+dnaHtml(item.dna, item.scamType, item.scamConfidence)+'</div>'+
  mlPanelHtml(item)+
  '<div class="panel"><h3 class="section-title">Red flags detected</h3>'+
    flagListHtml(item.indicators, item.id)+
  '</div>'+
  '<div class="panel"><h3 class="section-title">Evidence extracted</h3>'+
    '<div class="field-row"><span class="k">Evidence ID</span><span class="v">'+esc(item.id)+'</span></div>'+
    evidenceRows+hashRow+versionRow+
  '</div>'+
  '<div class="panel"><h3 class="section-title">Recommended actions</h3><ul class="recommend-list">'+recHtml+'</ul></div>'+
  feedbackHtml(item.id)+
  (state.mode==='investigator' ? '<div class="panel"><details><summary>Raw evidence record (investigator mode)</summary><pre class="raw-json">'+esc(JSON.stringify(item,null,2))+'</pre></details></div>' : '');
}
function attackChainHtml(chain){
  if (!chain || !chain.stages || !chain.matchedCount) return '';
  var steps = chain.stages.map(function(s){
    return '<div class="chain-step'+(s.matched?' hit':'')+'"><span class="cs-ic">'+(s.matched?'\u2713':'\u2013')+'</span>'+esc(s.label)+'</div>';
  }).join('');
  return '<div class="panel"><h3 class="section-title">Attack chain</h3>'+
    '<p class="hint" style="margin-top:0;">Stages of a typical social-engineering scam that this evidence shows signs of, based on the same indicators above \u2014 not a separate detector.</p>'+
    '<div class="chain-row">'+steps+'</div></div>';
}
function feedbackHtml(evidenceId){
  var existing = U.Feedback ? U.Feedback.get(evidenceId) : null;
  function btn(value, label){
    return '<button class="feedback-btn'+(existing===value?' chosen':'')+'" type="button" data-action="feedback" data-id="'+esc(evidenceId)+'" data-value="'+value+'">'+label+'</button>';
  }
  return '<div class="panel"><h3 class="section-title">Was this result useful?</h3>'+
    '<div class="feedback-row">'+btn('correct','\u{1F44D} Correct')+btn('incorrect','\u{1F44E} Incorrect')+btn('insufficient','\u2753 Insufficient information')+'</div>'+
    '<p class="feedback-note">Feedback is stored only on this device with this case, so you can review your own track record \u2014 it is not sent anywhere or used to automatically retrain any model.</p>'+
  '</div>';
}

    '<button class="btn secondary sm" data-action="nav" data-route="cases">View all</button></div>'+

function statsHtml(){
  var idx = state.casesIndex;
  var high = idx.filter(function(c){ return c.level==='high'; }).length;
  var med = idx.filter(function(c){ return c.level==='medium'; }).length;
  var low = idx.filter(function(c){ return c.level==='low'; }).length;
  return '<div class="hero-stats">'+
    '<div class="hero-stat"><div class="n">'+idx.length+'</div><div class="l">Total cases</div></div>'+
    '<div class="hero-stat"><div class="n risk-high">'+high+'</div><div class="l">High risk</div></div>'+
    '<div class="hero-stat"><div class="n risk-medium">'+med+'</div><div class="l">Medium risk</div></div>'+
    '<div class="hero-stat"><div class="n risk-low">'+low+'</div><div class="l">Low risk</div></div>'+
  '</div>';
}
function scamTypeBreakdownHtml(){
  var idx = state.casesIndex;
  if (!idx.length) return '';
  var counts = {};
  idx.forEach(function(c){
    var t = c.scamType && c.scamType !== 'No specific scam pattern detected' ? c.scamType : null;
    if (!t) return;
    counts[t] = (counts[t]||0) + 1;
  });
  var keys = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; }).slice(0,6);
  if (!keys.length) return '';
  var maxN = counts[keys[0]];
  var rows = keys.map(function(k){
    var pct = Math.round((counts[k]/maxN)*100);
    return '<div class="dna-row"><span class="dl">'+esc(k)+'</span>'+
      '<span class="dna-bar"><span class="f" style="width:'+pct+'%"></span></span>'+
      '<span class="dn">'+counts[k]+'</span></div>';
  }).join('');
  return '<div class="panel"><h3 class="section-title">Most common scam types in your cases</h3>'+rows+'</div>';
}

function verifyFormShell(type, bodyHtml, addTo){
  var t = TYPES[type];
  var backRoute = addTo ? 'case' : 'verify';
  return ''+
    '<button class="btn secondary sm" data-action="nav" data-route="'+backRoute+'" data-id="'+esc(addTo||'')+'" style="margin-bottom:18px;">\u2190 '+(addTo?'Back to case':'All evidence types')+'</button>'+
    (addTo ? '<div class="tag">Adding to case '+esc(addTo)+'</div>' : '')+
    '<h1 class="page-title">'+t.icon+' &nbsp;'+esc(t.name)+'</h1>'+
    '<p class="lede">'+esc(t.desc)+'</p>'+
    '<div class="panel">'+bodyHtml+'</div>';
}

function renderVerify(params){
  var type = params && params.type;
  var addTo = params && params.addTo;
  if (!type){
    return '<div class="kicker">VERIFY SOMETHING</div><h1 class="page-title">What do you want to verify?</h1>'+
      '<p class="lede">Choose the kind of evidence you have. You can add more evidence to the same case afterward.</p>'+
      tileGridHtml(addTo);
  }
  var body = '';
  switch(type){
    case 'message':
      body = '<div class="field"><label for="input-value">Paste the message text</label>'+
        '<textarea id="input-value" rows="8" placeholder="Your SBI account will be blocked today. Complete KYC immediately using this link..."></textarea></div>'+
        '<button class="btn" id="analyze-btn" data-action="analyze-text" data-type="message" data-addto="'+esc(addTo||'')+'">Analyze evidence</button>';
      break;
    case 'url':
      body = '<div class="field"><label for="input-value">Paste the URL</label>'+
        '<input type="text" id="input-value" placeholder="https://sbi-kyc-verification-example.com"></div>'+
        '<button class="btn" id="analyze-btn" data-action="analyze-text" data-type="url" data-addto="'+esc(addTo||'')+'">Analyze evidence</button>';
      break;
    case 'phone':
      var countryOptions = U.Analyze.COUNTRIES.map(function(c){
        return '<option value="'+c.code+'"'+(c.code==='IN'?' selected':'')+'>'+c.flag+' '+esc(c.name)+(c.dial?' (+'+c.dial+')':'')+'</option>';
      }).join('');
      body = '<div class="field"><label for="phone-country">Country</label>'+
        '<select id="phone-country">'+countryOptions+'</select></div>'+
        '<div class="field"><label for="input-value">Phone number</label>'+
        '<input type="tel" id="input-value" placeholder="98XXXXXX00"></div>'+
        '<p class="hint">Checked against formatting and pattern rules for the selected country only \u2014 not a live caller-reputation database. TrustChain does not assume every number is Indian.</p>'+
        '<button class="btn" id="analyze-btn" data-action="analyze-text" data-type="phone" data-addto="'+esc(addTo||'')+'">Analyze evidence</button>';
      break;
    case 'upi':
      body = '<div class="field"><label for="input-value">UPI ID</label>'+
        '<input type="text" id="input-value" placeholder="someone@upi"></div>'+
        '<p class="hint">Checked against formatting and naming-pattern rules only \u2014 not a live payment-reputation database.</p>'+
        '<button class="btn" id="analyze-btn" data-action="analyze-text" data-type="upi" data-addto="'+esc(addTo||'')+'">Analyze evidence</button>';
      break;
    case 'voice':
      body = '<div class="field"><label for="input-value">Paste the call transcript</label>'+
        '<textarea id="input-value" rows="8" placeholder="Sir, I am calling from your bank. Please tell me your OTP..."></textarea></div>'+
        '<p class="hint">This demo analyzes a pasted transcript \u2014 it does not transcribe uploaded audio in-browser.</p>'+
        '<button class="btn" id="analyze-btn" data-action="analyze-text" data-type="voice" data-addto="'+esc(addTo||'')+'">Analyze evidence</button>';
      break;
    case 'screenshot': case 'qr': case 'document':
      var accept = type==='document' ? '.pdf,application/pdf' : 'image/*';
      var dzText = type==='document' ? 'Click to upload a PDF, or drag one here' : 'Click to upload an image, or drag one here';
      body = ''+
        '<label class="dropzone" for="file-input"><span class="dz-icon">'+(type==='document'?'\u{1F4C4}':'\u{1F4F7}')+'</span>'+
        '<span id="dz-status">'+dzText+'</span><input type="file" id="file-input" accept="'+accept+'"></label>'+
        '<div id="file-preview"></div>'+
        '<div id="proc-status" class="spinner-row" style="display:none;"><span class="dot-pulse"></span><span id="proc-text">Working\u2026</span></div>'+
        '<div class="btn-row"><button class="btn" id="analyze-btn" data-action="analyze-file" data-type="'+type+'" data-addto="'+esc(addTo||'')+'" disabled>Analyze evidence</button></div>';
      break;
  }
  return verifyFormShell(type, body, addTo);
}

function renderCases(){
  var idx = state.casesIndex.slice();
  if (state.filterLevel !== 'all'){ idx = idx.filter(function(c){ return c.level === state.filterLevel; }); }
  if (state.filterQuery){
    var q = state.filterQuery.toLowerCase();
    idx = idx.filter(function(c){ return (c.title||'').toLowerCase().indexOf(q)!==-1 || c.id.toLowerCase().indexOf(q)!==-1; });
  }
  var levels = ['all','high','medium','low'];
  var chipHtml = levels.map(function(l){

function evidenceGraphHtml(c){
  var entities = U.CaseModel.correlateEntities(c.evidenceItems);
  if (!entities.length) return '';
  var cx=300, cy=170, r=125;
  var nodes = entities.slice(0,8).map(function(e, i, arr){
    var angle = (Math.PI*2 * i / Math.max(arr.length,1)) - Math.PI/2;
    var x = cx + r*Math.cos(angle), y = cy + r*Math.sin(angle);
    var label = e.value.length>20 ? e.value.slice(0,19)+'\u2026' : e.value;
    return { x:x, y:y, label:label, count:e.count };
  });
  var lines = nodes.map(function(n){ return '<line x1="'+cx+'" y1="'+cy+'" x2="'+n.x+'" y2="'+n.y+'" stroke="#94a3b8" stroke-width="1.5"/>'; }).join('');
  var circles = nodes.map(function(n){
    var rad = 9 + Math.min(n.count,5)*2;
    return '<g><circle cx="'+n.x+'" cy="'+n.y+'" r="'+rad+'" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>'+
      '<text x="'+n.x+'" y="'+(n.y+rad+14)+'" text-anchor="middle" font-size="11" fill="#1e293b">'+esc(n.label)+'</text></g>';
  }).join('');
  var caseNode = '<circle cx="'+cx+'" cy="'+cy+'" r="32" fill="#0f172a"/><text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">CASE</text>';
  var svg = '<svg viewBox="0 0 600 340" width="100%" style="max-width:600px; display:block; margin:0 auto;" role="img" aria-label="Evidence relationship graph">'+lines+caseNode+circles+'</svg>';
  return '<div class="panel"><h3 class="section-title">Evidence relationship graph</h3>'+
    '<p class="hint" style="margin-top:0;">Each node is a link, phone number or payment ID that shows up in more than one piece of evidence \u2014 the larger the node, the more items it connects.</p>'+svg+'</div>';
}
function caseAnalysisTab(c){

function wireFileInput(){
  var fi = document.getElementById('file-input');
  if (!fi) return;
  fi.addEventListener('change', function(){
    var file = fi.files && fi.files[0];
    if (!file) return;
    var routeType = state.route && state.route.params && state.route.params.type;
    var kind = routeType === 'document' ? 'pdf' : 'image';
    var status = document.getElementById('dz-status');
    var prev = document.getElementById('file-preview');
    var btn = document.getElementById('analyze-btn');
    // Validate BEFORE accepting the file into state, so an oversized or
    // wrong-type file never reaches OCR/QR/PDF processing (which is where
    // a huge image could otherwise freeze the tab via canvas memory use).
    var v = window.TC.Files.validateFile(file, kind);
    if (!v.ok){
      state.pendingFile = null;
      if (status) status.textContent = v.message;
      if (prev) prev.innerHTML = '';
      if (btn) btn.disabled = true;
      fi.value = '';
      toast(v.message);
      return;
    }
    state.pendingFile = file;
    if (status) status.textContent = 'Selected: ' + file.name + ' (' + U.Files.humanSize(file.size) + ')';
    if (prev){
      prev.innerHTML = '';
      if (file.type.indexOf('image/') === 0){
        var url = URL.createObjectURL(file);
        prev.appendChild(U.el('<img class="preview-img" src="'+url+'" alt="Preview of uploaded file">'));
      }
    }
    if (btn) btn.disabled = false;
  });
}
function wireFilterInputs(){
  var q = document.querySelector('[data-action="filter-query"]');
  if (q){
    q.addEventListener('input', function(){ state.filterQuery = q.value; renderCasesInPlace(); });
  }
}
function renderCasesInPlace(){
  var main = document.querySelector('.main .wrap');
  if (!main || state.route.name !== 'cases') return;
  var footer = main.querySelector('.footer-note');
  main.innerHTML = mainHtml() + (footer ? footer.outerHTML : '');
  wireFilterInputs();
}

/* ---------------- analyze pipelines dispatch ---------------- */
async function runTextAnalysis(type, addTo){
  var input = document.getElementById('input-value');
  var value = input ? input.value.trim() : '';
  if (!value){ toast('Enter something to verify first.'); return; }
  var btn = document.getElementById('analyze-btn');
  var originalText = btn.textContent;
  btn.disabled = true; btn.textContent = 'Analyzing\u2026';
  try {
    var item;
    if (type === 'phone'){
      var countrySel = document.getElementById('phone-country');
      item = await Pipelines.phone(value, countrySel ? countrySel.value : 'IN');
    } else {
      item = await Pipelines[type](value);
    }
    await handleNewEvidence(item, addTo);
  } catch(e){
    toast('Something went wrong analyzing this evidence.');
    btn.disabled = false; btn.textContent = originalText;
  }
}
async function runFileAnalysis(type, addTo){
  if (!state.pendingFile){ toast('Choose a file first.'); return; }
  var btn = document.getElementById('analyze-btn');
  var procRow = document.getElementById('proc-status');
  var procText = document.getElementById('proc-text');
  btn.disabled = true; btn.textContent = 'Analyzing\u2026';
  if (procRow) procRow.style.display = 'flex';
  function onProgress(pct, status){
    if (!procText) return;
    if (pct != null) procText.textContent = (type==='screenshot' ? 'Reading text from image\u2026 ' : 'Reading document\u2026 ') + pct + '%';
    else if (status) procText.textContent = status.charAt(0).toUpperCase()+status.slice(1)+'\u2026';
  }
  try {
    var item = (type === 'qr') ? await Pipelines.qr(state.pendingFile) : await Pipelines[type](state.pendingFile, onProgress);
    await handleNewEvidence(item, addTo);
  } catch(e){
    toast(e && e.message ? e.message : 'Something went wrong analyzing this file.');
    btn.disabled = false; btn.textContent = 'Analyze evidence';
    if (procRow) procRow.style.display = 'none';
  }
}
function recordFeedback(evidenceId, value){
  var ok = U.Feedback.set(evidenceId, value);
  toast(ok ? 'Thanks \u2014 feedback saved on this device.' : 'Could not save feedback (storage unavailable).');
}
function saveFailureToast(result){
  var backendNote = result && result.backend === 'memory'
    ? ' This browser session has no persistent storage available, so nothing survives a refresh — export a JSON copy now if you need to keep this.'
    : ' Your device storage may be full or restricted (private browsing can block this) — export a JSON copy as a backup.';
  toast('Could not save this case.' + backendNote);
}
async function mergeEvidenceIntoCase(targetId){
  if (!state.current || !state.current.evidenceItems || !state.current.evidenceItems.length){ return; }
  var existing = await Store.loadCase(targetId);
  if (!existing){ toast('That case could not be found anymore.'); return; }
  CaseModel.addEvidenceToCase(existing, state.current.evidenceItems[0]);
  var result = await Store.saveCase(existing);
  if (!result.ok){ saveFailureToast(result); return; }
  state.current = existing;
  toast('Evidence linked to the existing case.');
  await navigate('case', { id: existing.id });
}
async function handleNewEvidence(item, addTo){
  if (addTo){
    var existing = await Store.loadCase(addTo);
    if (!existing){ toast('That case could not be found anymore.'); await navigate('cases', {}); return; }
    CaseModel.addEvidenceToCase(existing, item);
    var result = await Store.saveCase(existing);
    if (!result.ok){ state.current = existing; saveFailureToast(result); await navigate('case', { id: existing.id }); return; }
    state.current = existing;
    toast('Evidence added to case.');
    await navigate('case', { id: existing.id });
  } else {
    state.current = CaseModel.buildCase(item);
    await navigate('result', {});
  }
}

/* ---------------- global event delegation ---------------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-action]');
  if (!t) return;
  var action = t.dataset.action;
  switch(action){
    case 'nav':
      e.preventDefault();
      if (t.dataset.addtoFlag){ navigate('verify', { addTo: t.dataset.id }); }
      else { navigate(t.dataset.route, t.dataset.id ? { id:t.dataset.id } : {}); }
      break;
    case 'choose-type':
      navigate('verify', { type:t.dataset.type, addTo: t.dataset.addto || null });
      break;
    case 'toggle-mode':
      state.mode = t.dataset.mode; render();
      break;
    case 'analyze-text':
      runTextAnalysis(t.dataset.type, t.dataset.addto || null);
      break;
    case 'merge-evidence':
      mergeEvidenceIntoCase(t.dataset.id);
      break;
    case 'analyze-file':
      runFileAnalysis(t.dataset.type, t.dataset.addto || null);
      break;
    case 'save-case':
      if (state.current){
        Store.saveCase(state.current).then(function(result){
          if (result.ok){ state.current.saved = true; toast('Case saved.'); }
          else { state.current.saved = false; saveFailureToast(result); }
          render();
        });
      }
      break;
    case 'view-case':
      navigate('case', { id:t.dataset.id });
      break;
    case 'case-tab':
      state.activeTab = t.dataset.tab; render();
      break;
    case 'delete-case':
      if (window.confirm('Delete this case permanently?')){
        Store.deleteCase(t.dataset.id).then(function(result){
          toast(result.ok ? 'Case deleted.' : 'Delete may not have fully completed — check your cases list.');
          navigate('cases', {});
        });
      }
      break;
    case 'wipe-all-data':
      if (window.confirm('Permanently delete ALL TrustChain cases and evidence stored on this device? This cannot be undone.')){
        Store.wipeAllData().then(function(result){
          toast(result.ok ? 'All local TrustChain data deleted.' : 'Some data may not have been fully deleted — please check.');
          navigate('privacy', {});
        });
      }
      break;
    case 'generate-report':
      navigate('report', {});
      break;
    case 'export-json-redacted':
      if (state.current){
        var payloadR = U.buildExportPayload(state.current, false);
        U.downloadBlob(state.current.id + '-redacted.json', JSON.stringify(payloadR, null, 2), 'application/json');
        toast('Case exported (redacted).');
      }
      break;
    case 'export-json-full':
      if (state.current){
        var proceed = window.confirm('This export includes UNREDACTED original text \u2014 phone numbers, UPI IDs, emails, names and other sensitive details will NOT be masked. Only proceed if you understand who you\u2019re sharing this file with. Continue?');
        if (proceed){
          var payloadF = U.buildExportPayload(state.current, true);
          U.downloadBlob(state.current.id + '-full-evidence.json', JSON.stringify(payloadF, null, 2), 'application/json');
          toast('Case exported (full, unredacted).');
        }
      }
      break;
    case 'print-report':
      window.print();
      break;
    case 'filter-level':
      state.filterLevel = t.dataset.level; render();
      break;
    case 'toggle-why':
      var box = document.getElementById(t.dataset.target);
      if (box) box.classList.toggle('open');
      break;
    case 'set-status':
      if (state.current && state.current.id === t.dataset.id){
        var prevStatus = state.current.status;
        state.current.status = t.dataset.status;
        Store.saveCase(state.current).then(function(result){
          if (result.ok){ toast('Case marked '+t.dataset.status+'.'); }
          else { state.current.status = prevStatus; saveFailureToast(result); }
          render();
        });
      }
      break;
    case 'feedback':
      if (state.current){
        recordFeedback(t.dataset.id, t.dataset.value);
        render();
      }
      break;
    case 'select-emergency':
      state.emergencySelected = state.emergencySelected || {};
      state.emergencySelected[t.dataset.key] = !state.emergencySelected[t.dataset.key];
      render();
      break;
    case 'radar-check':
      navigate('verify', {});
      break;
  }
});

function renderTcGate(){
  var gate = document.getElementById('tc-gate');
  if (!gate) { bootApp(); return; }
  gate.innerHTML =
    '<div class="tc-gate-card" tabindex="-1">'+
      '<div class="tc-gate-head">'+
        '<div class="brandrow">'+ (window.TC.logo ? window.TC.logo(30,{}) : '') +'<strong id="tc-gate-title" style="font-size:16px; color:var(--ink);">TrustChain \u2014 Terms &amp; Conditions</strong></div>'+
        '<p>Please read and accept before using this tool.</p>'+
      '</div>'+
      '<div class="tc-gate-body">'+ tcGateTermsHtml() +'</div>'+
      '<div class="tc-gate-foot">'+
        '<label class="tc-gate-check"><input type="checkbox" id="tc-gate-checkbox"><span>I have read and agree to the Terms &amp; Conditions above, including the accuracy and liability limitations.</span></label>'+
        '<div class="tc-gate-btns">'+
          '<button class="btn secondary" id="tc-gate-decline" type="button">Decline</button>'+
          '<button class="btn" id="tc-gate-accept" type="button" disabled>Accept &amp; Enter TrustChain</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  gate.classList.add('open');
  document.body.style.overflow = 'hidden';
  var cb = document.getElementById('tc-gate-checkbox');
  var acceptBtn = document.getElementById('tc-gate-accept');
  var declineBtn = document.getElementById('tc-gate-decline');
  cb.addEventListener('change', function(){ acceptBtn.disabled = !cb.checked; });
  acceptBtn.addEventListener('click', function(){
    try { localStorage.setItem(TC_GATE_KEY, String(Date.now())); } catch(e){ /* storage unavailable — proceed for this session anyway */ }
    gate.classList.remove('open');
    gate.innerHTML = '';
    document.body.style.overflow = '';
    bootApp();
  });
  declineBtn.addEventListener('click', function(){
    gate.innerHTML = '<div class="tc-gate-card"><div class="tc-gate-head"><h2>Terms not accepted</h2>'+
      '<p>You need to accept the Terms &amp; Conditions to use TrustChain. You can close this tab, or reconsider below.</p></div>'+
      '<div class="tc-gate-foot"><div class="tc-gate-btns"><button class="btn" id="tc-gate-reconsider" type="button">Review terms again</button></div></div></div>';
    document.getElementById('tc-gate-reconsider').addEventListener('click', renderTcGate);
  });
  var focusTarget = gate.querySelector('.tc-gate-card');
  if (focusTarget) focusTarget.focus();
}
(function initGate(){
  var alreadyAccepted = false;
  try { alreadyAccepted = !!localStorage.getItem(TC_GATE_KEY); } catch(e){ alreadyAccepted = false; }
  if (alreadyAccepted){ bootApp(); } else { renderTcGate(); }
})();
})();
